let _autoNotifyDay=null;
let _autoNotifyAttempted=false;
async function autoNotify(){
  if(!store||!user)return;
  
  const dailyEnabled = localStorage.getItem('muzn_daily_notify') !== '0';
  if(!dailyEnabled) return;
  const t=today();
  if(_autoNotifyDay===t && _autoNotifyAttempted)return;
  _autoNotifyDay=t;
  try{
    // =========================================================
    // 1) عملاء متأخرون — إشعار لكل موزع + للمدراء
    // =========================================================
    const custByDist={};
    store.customers.forEach(c=>{
      if(!c.distributor_id)return;
      const b=custBal(store,c);
      if(b.bucket==='overdue'){
        (custByDist[c.distributor_id]=custByDist[c.distributor_id]||[]).push(
          c.name+' ('+fmt(b.remaining)+' '+cur()+')'
        );
      }
    });
    
    for(const did in custByDist){
      const d=store.distributors.find(x=>x.id===did);
      if(!d)continue;
      
      const summary = custByDist[did].slice(0,3).join('، ') + 
        (custByDist[did].length>3 ? ' +'+(custByDist[did].length-3) : '');
      
      // إشعار للموزع نفسه
      if(d.user_id){
        NotificationCenter.fire('overdue_cust_single', {
          distUserId: d.user_id,
          summary: summary,
          refId: d.id
        }).catch(e=>console.warn(e));
      }
      
      // إشعار للمدراء (النسخة القديمة)
      NotificationCenter.fire('overdue_cust', {
        distName: d.name,
        summary: summary,
        refId: d.id
      }).catch(e=>console.warn(e));
      
      // حفظ في notices للمدراء
      const exists = store.notices.some(n => 
        n.kind==='distributor' && n.target_id===did && 
        n.date===t && (n.title||'').indexOf('فاتورة عميل متأخرة')===0
      );
      if(!exists){
        const row = {
          id:uuid(), date:t, kind:'distributor', target_id:did,
          title:'فاتورة عميل متأخرة — '+d.name,
          body:custByDist[did].join('، '),
          items:[], by:'تنبيه تلقائي', ts:Date.now(), done:false
        };
        store.notices.unshift(row);
        try{await adapter.saveSimple('notices',row)}catch(ex){console.error(ex)}
      }
    }

    // =========================================================
    // 2) موزعون متأخرون — للمدراء فقط (كما كان)
    // =========================================================
    const lateDist = store.distributors
      .map(d=>({d,s:dSummary(store,d)}))
      .filter(x=>x.s.per.left<0 && x.s.bal>0.009);
    
    if(lateDist.length>0){
      NotificationCenter.fire('late_dist', {
        summary: lateDist.map(x=>x.d.name+' ('+fmt(x.s.bal)+')').join('، ')
      }).catch(e=>console.warn(e));
    }
    
    // 🆕 إشعارات تسليم قريب لكل موزع
    for(const d of store.distributors){
      const s = dSummary(store, d);
      if(s.per.left >= 0 && s.per.left <= 1 && s.bal > 0.009){
        if(d.user_id){
          NotificationCenter.fire('collection_due_dist', {
            distUserId: d.user_id,
            summary: 'التسليم ' + (s.per.left===0?'اليوم':'غداً') + ' — ' + 
                     fmt(s.bal) + ' ' + cur(),
            refId: d.id
          }).catch(e=>console.warn(e));
        }
      }
    }

    // =========================================================
    // 3) مخزون منخفض — إشعار للمدراء + المشتريات
    // =========================================================
    const lowStock = store.products.filter(p => 
      p.min_stock && stockWH(store,p.id) < p.min_stock
    );
    const lowMat = store.materials.filter(m => 
      m.min_stock && materialStock(store,m.id) < m.min_stock
    );
    
    if(lowStock.length + lowMat.length > 0){
      const lines = [];
      if(lowStock.length) lines.push('منتجات: '+lowStock.slice(0,3).map(p=>p.name).join('، '));
      if(lowMat.length) lines.push('مواد: '+lowMat.slice(0,3).map(m=>m.name).join('، '));
      
      // للمدراء
      NotificationCenter.fire('low_stock', {
        summary: lines.join(' · ')
      }).catch(e=>console.warn(e));
      
      // 🆕 للمشتريات
      const buyers = store.users.filter(u => 
        u.active && u.role==='staff' && 
        u.perms && u.perms.indexOf('purchases') >= 0
      );
      for(const b of buyers){
        sendPush(
          b.id,
          '📦 نواقص — ' + (lowStock.length + lowMat.length) + ' عنصر',
          lines.join(' · '),
          '/#purchases',
          'low_stock_buyer',
          null
        ).catch(e=>console.warn(e));
      }
    }

    // =========================================================
    // 4) 🆕 ملخص إنتاج يومي لكل مشغّل
    // =========================================================
    const todayItems = store.shift_items_flat.filter(s => s.date === t);
    
    if(todayItems.length > 0){
      for(const o of store.operators){
        if(!o.user_id) continue;
        
        const myItems = todayItems.filter(s => s.operator_id === o.id);
        if(!myItems.length) continue;
        
        const totalActual = sum(myItems, s => s.actual);
        const totalWaste = sum(myItems, s => s.waste);
        const totalDown = sum(myItems, s => s.down);
        const productsCount = myItems.length;
        
        const summary = `${productsCount} منتج · منجز ${fmt(totalActual)} · هدر ${fmt(totalWaste)}` + 
          (totalDown > 0 ? ` · توقف ${fmt(totalDown)} د` : '');
        
        NotificationCenter.fire('production_daily', {
          operatorUserId: o.user_id,
          summary: summary,
          refId: o.id
        }).catch(e=>console.warn(e));
      }
    }

    // =========================================================
    // 5) 🆕 طلبات النواقص → المشتريات + المدراء
    // =========================================================
    const pendingPR = (store.purchase_requests || [])
      .filter(r => r.status === 'pending');
    
    if(pendingPR.length > 0){
      const summary = `${pendingPR.length} طلب معلّق — راجعها`;
      
      const buyers = store.users.filter(u => 
        u.active && u.role==='staff' && 
        u.perms && u.perms.indexOf('purchases') >= 0
      );
      
      for(const b of buyers){
        sendPush(
          b.id,
          '📋 لديك ' + pendingPR.length + ' طلب نواقص',
          summary,
          '/#purchase_requests',
          'pr_pending_buyer',
          null
        ).catch(e=>console.warn(e));
      }
    }
    
    // =========================================================
    // 6) 🎁 مكافآت: متاحة اليوم + تنتهي قريباً + منتهية
    // =========================================================
    try{
      const activeRules = (store.bonus_rules || []).filter(r => r.active);
      
      for(const rule of activeRules){
        // 1) بدأت اليوم
        if(rule.valid_from === t){
          const targets = getBonusTargets(rule);
          for(const target of targets){
            if(target.userId){
              NotificationCenter.fire('bonus_available', {
                targetUserId: target.userId,
                ruleName: rule.name,
                rewardDescription: describeBonusReward(rule),
                validTo: rule.valid_to,
                url: target.url
              }).catch(e => console.warn(e));
            }
          }
        }
        
        // 2) تنتهي غداً (تذكير)
        if(rule.valid_to){
          const daysLeft = diffDays(rule.valid_to, t);
          if(daysLeft === 1){
            const targets = getBonusTargets(rule);
            for(const target of targets){
              const progress = computeBonusProgress(rule, target.entityId, target.entityType);
              if(!progress || progress.achievedOK) continue;
              
              if(target.userId){
                NotificationCenter.fire('bonus_expiring', {
                  targetUserId: target.userId,
                  ruleName: rule.name,
                  daysLeft: 1,
                  remaining: fmt(progress.remaining),
                  url: target.url
                }).catch(e => console.warn(e));
              }
            }
          }
          
          // 3) انتهت أمس (فشل)
          if(daysLeft === -1){
            const targets = getBonusTargets(rule);
            for(const target of targets){
              const progress = computeBonusProgress(rule, target.entityId, target.entityType);
              if(!progress || progress.achievedOK) continue;
              
              if(target.userId){
                NotificationCenter.fire('bonus_expired', {
                  targetUserId: target.userId,
                  targetName: target.name,
                  ruleName: rule.name,
                  url: target.url
                }).catch(e => console.warn(e));
              }
            }
          }
        }
      }
    }catch(ex){
      console.error('[Bonus Notify]', ex);
    }

    
    // =========================================================
    // حفظ علامة اليوم
    // =========================================================
    const pushDayKey = 'auto_push_v2_' + t;
    if(localStorage.getItem(pushDayKey) !== t){
      try{ localStorage.setItem(pushDayKey, t); }catch(e){}
    }
    
    _autoNotifyAttempted = true;
    renderBell();
  }catch(ex){
    console.error('[autoNotify] فشل:', ex);
    _autoNotifyAttempted = false;
  }
}

function alertsList(){
  if(!user) return {lowStock:[],lowMat:[],overdue:[],lateDist:[],notices:[],discounts:[],complaints:[]};
  const S=store;
  const lowStock=S.products.filter(p=>p.min_stock&&stockWH(S,p.id)<p.min_stock);
  const lowMat=S.materials.filter(m=>m.min_stock&&materialStock(S,m.id)<m.min_stock);
  const overdue=S.customers.map(c=>({c,b:custBal(S,c)})).filter(x=>x.b.bucket==='overdue');
  const lateDist=S.distributors.map(d=>({d,s:dSummary(S,d)})).filter(x=>x.s.per.left<0&&x.s.bal>0.009);
  const notices=(S.notices||[]).filter(n=>{
    if(n.done)return false;
    if(n.kind==='complaint')return false;
    if(n.target_id){
      if(n.target_id===user.id)return true;
      if(isA())return true;
      return false;
    }
    if(isA())return true;
    if(n.kind==='production')return user.perms.indexOf('production')>=0;
    if(n.kind==='distributor')return user.perms.indexOf('distributors')>=0||user.perms.indexOf('withdrawals')>=0;
    if(n.kind==='collection')return user.perms.indexOf('distributors')>=0||user.perms.indexOf('collections')>=0;
    if(n.kind==='discount')return n.target_id===user.id||n.by===user.name;
    return false;
  });
  const discounts=isA()?(S.discounts||[]).filter(d=>!d.cancelled).slice(0,5):[];
  const complaints=isA()?(S.complaints||[]).filter(c=>!c.done&&c.status!=='rejected'):[];
  return{lowStock,lowMat,overdue,lateDist,notices,discounts,complaints};
}

/* =====================================================================
   🆕 تحديد الإشعارات المهمة
   ===================================================================== */
function isImportantNotice(n){
  if(!n) return false;
  
  // ✅ إذا لم يُنجز → مهم
  if(n.done === false || n.done == null) return true;
  
  // ✅ أنواع مهمة دائماً
  const importantKinds = [
    'production_request',
    'purchase_request',
    'purchase_request_rejected',
    'collection_req',
    'discount',
    'complaint',
    'withdrawal_disputed',
    'withdrawal_recheck_requested',
    'withdrawal_created',
    'overdue_cust',
    'overdue_cust_single',
    'collection_due_dist',
    'late_dist',
    'early_shift_start',
    'late_shift_start'
  ];
  
  return importantKinds.indexOf(n.kind) >= 0;
}

/* =====================================================================
   🆕 معالج مسح الإشعارات
   ===================================================================== */
let _clearNoticesClicked = false;
let _clearNoticesTimer = null;

async function handleClearNotices(){
  const btn = byId('clear_notices_btn');
  if(!btn) return;
  
  // ✅ حساب الإشعارات
  const allNotices = store.notices || [];
  const important = allNotices.filter(n => isImportantNotice(n));
  const normal = allNotices.filter(n => !isImportantNotice(n));
  
  if(normal.length === 0 && important.length === 0){
    return toast('لا توجد إشعارات لمسحها','err');
  }
  
  // ✅ المرحلة 1: نقرة أولى
  if(!_clearNoticesClicked){
    _clearNoticesClicked = true;
    btn.innerHTML = '⚠️ اضغط مرة أخرى للحذف الكامل (يشمل المهمة)';
    btn.style.background = 'rgba(255,111,97,.15)';
    btn.style.color = 'var(--red)';
    
    // ✅ إذا مرت 5 ثوانٍ — أعد الحالة
    if(_clearNoticesTimer) clearTimeout(_clearNoticesTimer);
    _clearNoticesTimer = setTimeout(() => {
      _clearNoticesClicked = false;
      if(btn){
        btn.innerHTML = '🗑️ مسح الإشعارات العادية';
        btn.style.background = '';
        btn.style.color = 'var(--orange)';
      }
    }, 5000);
    
    // ✅ عرض معلومات
    toast(
      `سيُمسح ${normal.length} إشعار عادي. اضغط مرة أخرى لمسح المهمة أيضاً (${important.length})`,
      'err'
    );
    return;
  }
  
  // ✅ المرحلة 2: نقرة ثانية
  if(_clearNoticesTimer) clearTimeout(_clearNoticesTimer);
  _clearNoticesClicked = false;
  
  // ✅ نافذة تأكيد
  const confirmMsg = 
    `سيتم مسح:\n` +
    `• ${normal.length} إشعار عادي\n` +
    `• ${important.length} إشعار مهم 🔴\n\n` +
    `⚠️ لا يمكن التراجع!\n\n` +
    `هل أنت متأكد؟`;
  
  const userConfirmed = window.confirm(confirmMsg);
  
  if(!userConfirmed){
    btn.innerHTML = '🗑️ مسح الإشعارات العادية';
    btn.style.background = '';
    btn.style.color = 'var(--orange)';
    return;
  }
  
  // ✅ تأكيد نهائي بسيط
  if(!window.confirm('تأكيد أخير: هل تريد حقاً مسح جميع الإشعارات؟')){
    btn.innerHTML = '🗑️ مسح الإشعارات العادية';
    btn.style.background = '';
    btn.style.color = 'var(--orange)';
    return;
  }
  
  // ✅ تنفيذ المسح
  await performClear(allNotices);
}

async function performClear(allNotices){
  const btn = byId('clear_notices_btn');
  if(btn){
    btn.disabled = true;
    btn.innerHTML = '⏳ جارٍ المسح...';
  }
  
  try{
    // ✅ احذف الكل من قاعدة البيانات
    for(const n of allNotices){
      try{
        await adapter.deleteSimple('notices', n.id);
      }catch(e){
        console.warn('فشل حذف إشعار:', n.id, e);
      }
    }
    
    // ✅ حدّث store
    const draft = clone(store);
    draft.notices = [];
    
    // ✅ سجل العملية
    draft.audit.unshift({
      id: uuid(),
      ts: Date.now(),
      by: user.name,
      act: 'مسح',
      text: 'مسح ' + allNotices.length + ' إشعار'
    });
    
    store = draft;
    
    // ✅ حدّث الواجهة
    closeSheet();
    toast('✅ تم مسح ' + allNotices.length + ' إشعار','ok');
    renderAll();
    renderBell();
    
  }catch(ex){
    console.error(ex);
    toast('تعذر المسح: ' + ex.message,'err');
    if(btn){
      btn.disabled = false;
      btn.innerHTML = '🗑️ مسح الإشعارات العادية';
    }
  }
}

/* =====================================================================
   🆕 مسح الإشعارات العادية فقط (بضغطة واحدة)
   ===================================================================== */
async function clearNormalNoticesOnly(){
  const allNotices = store.notices || [];
  const normal = allNotices.filter(n => !isImportantNotice(n));
  
  if(normal.length === 0){
    return toast('لا توجد إشعارات عادية لمسحها','err');
  }
  
  const confirmed = window.confirm(
    `🗑️ مسح ${normal.length} إشعار عادي\n\n` +
    `سيتم الاحتفاظ بالإشعارات المهمة (${allNotices.length - normal.length}).\n\n` +
    `هل أنت متأكد؟`
  );
  
  if(!confirmed) return;
  
  try{
    for(const n of normal){
      try{
        await adapter.deleteSimple('notices', n.id);
      }catch(e){
        console.warn('فشل حذف إشعار:', n.id, e);
      }
    }
    
    const draft = clone(store);
    draft.notices = draft.notices.filter(n => isImportantNotice(n));
    draft.audit.unshift({
      id: uuid(),
      ts: Date.now(),
      by: user.name,
      act: 'مسح',
      text: 'مسح ' + normal.length + ' إشعار عادي (احتفظ بالمهمة)'
    });
    
    store = draft;
    
    closeSheet();
    toast('✅ تم مسح ' + normal.length + ' إشعار عادي','ok');
    renderAll();
    renderBell();
    
  }catch(ex){
    console.error(ex);
    toast('تعذر المسح: ' + ex.message,'err');
  }
}

function rejectComplaintSheet(id){
  const c=(store.complaints||[]).find(x=>x.id===id);
  if(!c)return;
  openSheet('<h3>❌ رفض '+(c.type==='withdraw'?'طلب السحب':'الشكوى')+'</h3>'+
    '<div class="card" style="margin-bottom:12px">'+
      '<div class="kv"><span>من</span><b>'+escHtml(c.by||'—')+'</b></div>'+
      '<div class="kv"><span>التفاصيل</span><b>'+escHtml(c.reason||'')+'</b></div>'+
      (c.type==='withdraw'?'<div class="kv"><span>المبلغ</span><b>'+fmt(c.amount)+' '+cur()+'</b></div>':'')+
    '</div>'+
    '<div id="rej-cp-form"></div>');
  mountForm(byId('rej-cp-form'),'rejcp',[
    {k:'reason',label:'سبب الرفض (سيُرسل للطالب)',type:'textarea',placeholder:'مثال: المبلغ غير متاح حالياً'}
  ],{label:'❌ تأكيد الرفض',submit:async v=>{
    if(!v.reason){toast('اذكر سبب الرفض','err');return false}
    try{
      const patch={done:true,status:'rejected',rejected_by:user.name,rejected_at:Date.now(),rejection_reason:v.reason};
      await adapter.updateSimple('complaints',id,patch);
      const cc=(store.complaints||[]).find(x=>x.id===id);
      if(cc)Object.assign(cc,patch);
      toast('تم الرفض وإرسال الإشعار','ok');
      closeSheet();
      renderAll();
      const targetUser = store.users.find(u => u.name === c.by);
      if(targetUser){
        sendPush(targetUser.id,'❌ تم رفض '+(c.type==='withdraw'?'طلب سحب المال':'شكواك'),'السبب: '+v.reason,'/#overview','complaint_rejected',id)
          .catch(e=>console.warn('push fail',e));
      }
    }catch(ex){console.error(ex);toast('تعذر: '+ex.message,'err')}
    return false;
  }});
}

/* =====================================================================
   🆕 Hard Refresh — تحديث قوي
   ===================================================================== */
let _hardRefreshClicked = false;
let _hardRefreshTimer = null;

async function hardRefresh(){
  const btn = byId('us-refresh');
  if(!btn) return;
  
  // ✅ المرحلة 1: نقرة أولى = تأكيد
  if(!_hardRefreshClicked){
    _hardRefreshClicked = true;
    btn.innerHTML = '⚠️ اضغط مرة أخرى للتأكيد<small>سيتم إعادة تحميل التطبيق</small>';
    btn.style.background = 'rgba(255,176,74,.15)';
    btn.style.color = 'var(--orange)';
    
    toast('اضغط مرة أخرى للتأكيد','err');
    
    if(_hardRefreshTimer) clearTimeout(_hardRefreshTimer);
    _hardRefreshTimer = setTimeout(() => {
      _hardRefreshClicked = false;
      if(btn){
        btn.innerHTML = '🔄 تحديث التطبيق (Hard Refresh)<small>يمسح الكاش ويعيد تحميل أحدث نسخة</small>';
        btn.style.background = '';
        btn.style.color = 'var(--blue)';
      }
    }, 3000);
    return;
  }
  
  // ✅ المرحلة 2: نقرة ثانية = تنفيذ
  if(_hardRefreshTimer) clearTimeout(_hardRefreshTimer);
  _hardRefreshClicked = false;
  
  btn.innerHTML = '⏳ جارٍ التحديث...<small>لا تغلق التطبيق</small>';
  btn.disabled = true;
  
  try{
    console.log('🔄 بدء Hard Refresh...');
    
    // احفظ الإعدادات
    const sess = localStorage.getItem(SESSKEY);
    const cloudCfg = localStorage.getItem(CFGKEY);
    const theme = localStorage.getItem(THEME_KEY);
    const pushEnabled = localStorage.getItem('muzn_push_enabled');
    const dailyNotify = localStorage.getItem('muzn_daily_notify');
    const lastPushDay = localStorage.getItem('auto_push_v2_' + today());
    
    // ألغِ Service Workers
    if('serviceWorker' in navigator){
      try{
        const regs = await navigator.serviceWorker.getRegistrations();
        console.log('  - Service Workers:', regs.length);
        for(const reg of regs){
          await reg.unregister();
        }
        console.log('  ✅ تم إلغاء Service Workers');
      }catch(e){
        console.warn('  ⚠️ فشل إلغاء SW:', e);
      }
    }
    
    // امسح Caches
    if('caches' in window){
      try{
        const keys = await caches.keys();
        console.log('  - Caches:', keys.length);
        for(const key of keys){
          await caches.delete(key);
        }
        console.log('  ✅ تم مسح Caches');
      }catch(e){
        console.warn('  ⚠️ فشل مسح Caches:', e);
      }
    }
    
    // استعد الإعدادات
    try{
      if(sess) localStorage.setItem(SESSKEY, sess);
      if(cloudCfg) localStorage.setItem(CFGKEY, cloudCfg);
      if(theme) localStorage.setItem(THEME_KEY, theme);
      if(pushEnabled) localStorage.setItem('muzn_push_enabled', pushEnabled);
      if(dailyNotify) localStorage.setItem('muzn_daily_notify', dailyNotify);
      if(lastPushDay) localStorage.setItem('auto_push_v2_' + today(), lastPushDay);
    }catch(e){
      console.warn('  ⚠️ فشل استعادة الإعدادات:', e);
    }
    
    // علامة إعادة التحميل
    try{
      sessionStorage.setItem('muzn_hard_refresh', '1');
    }catch(e){}
    
    console.log('  ✅ جاهز — إعادة التحميل...');
    setTimeout(() => {
      location.reload(true);
    }, 500);
    
  }catch(ex){
    console.error('❌ فشل Hard Refresh:', ex);
    toast('تعذر التحديث: ' + ex.message,'err');
    if(btn){
      btn.disabled = false;
      btn.innerHTML = '🔄 تحديث التطبيق (Hard Refresh)<small>يمسح الكاش ويعيد تحميل أحدث نسخة</small>';
      btn.style.background = '';
      btn.style.color = 'var(--blue)';
    }
  }
}

function haversineM(lat1,lng1,lat2,lng2){
  const R=6371000,toRad=d=>d*Math.PI/180;
  const dLat=toRad(lat2-lat1),dLng=toRad(lng2-lng1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLng/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function logLoginLocation(){
  if(!navigator.geolocation)return;
  navigator.geolocation.getCurrentPosition(async pos=>{
    const lat=pos.coords.latitude,lng=pos.coords.longitude;
    const wlat=store.company.warehouse_lat,wlng=store.company.warehouse_lng;
    let distance_m=null,within_range=false;
    if(wlat!=null&&wlng!=null){
      distance_m=Math.round(haversineM(lat,lng,wlat,wlng));
      within_range=distance_m<=(store.company.checkin_radius_m||300);
    }
    const row={id:uuid(),date:today(),distributor_id:null,lat,lng,
      distance_m,within_range,photo_url:null,note:'تسجيل دخول',
      by:user?user.name:'',ts:Date.now()};
    try{
      await adapter.saveSimple('checkins',row);
      if(store&&store.checkins)store.checkins.unshift(row);
    }catch(ex){console.error(ex)}
  },err=>{console.warn('تعذر الموقع',err)},{enableHighAccuracy:false,timeout:8000,maximumAge:60000});
}
function logout(){
  try{localStorage.removeItem(SESSKEY)}catch(e){}
  
  // ✅ سجّل الخروج من Supabase Auth
  if(adapter && adapter.sb && adapter.sb.auth){
    adapter.sb.auth.signOut().catch(e => console.warn('signOut failed:', e));
  }
  
  // إلغاء الاشتراك في الـ Realtime
  if(adapter && adapter.unsubscribe){
    try{ adapter.unsubscribe(); }catch(e){}
  }
  
  closeSheet();
  forms=[];
  showLogin();

function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(base64);
  const arr=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
  return arr;
}
async function registerServiceWorker(){
  if(!('serviceWorker' in navigator))return null;
  try{
    const reg=await navigator.serviceWorker.register('sw.js',{scope:'./'});
    console.log('[PWA] SW registered:',reg.scope);
    return reg;
  }catch(e){
    console.error('[PWA] SW register failed:',e);
    return null;
  }
}
async function subscribeToPush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){
    toast('متصفحك لا يدعم الإشعارات','err');
    return false;
  }
  if(Notification.permission!=='granted'){
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){toast('تم رفض إذن الإشعارات','err');return false;}
  }
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      sub=await reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const json=sub.toJSON();
    const row={id:uuid(),user_id:user.id,endpoint:json.endpoint,keys:json.keys,
      platform:'web',created_at:Date.now(),last_used:Date.now()};
    try{await adapter.saveSimple('push_subscriptions',row)}
    catch(ex){console.log('already subscribed or error:',ex.message)}
    try{localStorage.setItem('muzn_push_enabled','1')}catch(e){}
    return true;
  }catch(e){
    console.error('subscribeToPush error:',e);
    toast('تعذر تفعيل الإشعارات: '+e.message,'err');
    return false;
  }
}
async function unsubscribeFromPush(){
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    if(sub){
      const endpoint=sub.endpoint;
      await sub.unsubscribe();
      try{
        const all=await adapter.sb.from('push_subscriptions').select('id').eq('endpoint',endpoint);
        if(all.data)for(const r of all.data){
          await adapter.sb.from('push_subscriptions').delete().eq('id',r.id);
        }
      }catch(e){console.warn('delete sub failed',e)}
    }
    try{localStorage.removeItem('muzn_push_enabled')}catch(e){}
    toast('تم إيقاف الإشعارات','ok');
    return true;
  }catch(e){console.error(e);return false;}
}

function showSyncIndicator(text, type){

/* =====================================================================
   🆕 مزامنة ذكية — 5 ثوانٍ + Hash يشمل التعديلات
   ===================================================================== */
function computeStoreHash(s){
  if(!s) return '';
  // ✅ نشمل عدد السجلات + بصمات السجلات الحرجة (status / closed / done)
  const prq = (s.purchase_requests || []);
  const shifts = (s.distributor_shifts || []).concat(s.operator_shifts || []);
  const complaints = (s.complaints || []);
  const wc = (s.withdrawal_confirmations || []);
  return JSON.stringify({
    // الأطوال
    s: s.sales?.length, si: s.sale_items?.length,
    sh: s.shifts?.length, shi: s.shift_items?.length,
    w: s.withdrawals?.length, p: s.payments?.length,
    r: s.remittances?.length, pu: s.purchases?.length,
    dsh: s.distributor_shifts?.length, osh: s.operator_shifts?.length,
    da: s.dist_attendance?.length, a: s.attendance?.length,
    n: s.notices?.length, c: s.customers?.length,
    pr: s.products?.length, m: s.materials?.length,
    d: s.distributors?.length, u: s.users?.length,
    sp: s.supplier_payments?.length, disc: s.discounts?.length,
    prq: prq.length,
    wc: wc.length, 
    // ✅ بصمات الحالات (لكشف التعديلات بدون تغيير الطول)
    prqStatus: prq.map(x => x.id + ':' + x.status).sort().join(','),
    shiftState: shifts.map(x => x.id + ':' + (x.closed ? 'C' : 'O')).sort().join(','),
    compStatus: complaints.map(x => x.id + ':' + (x.done ? 'D' : 'P')).sort().join(','),
    noticeDone: (s.notices || []).map(x => x.id + ':' + (x.done ? '1' : '0')).sort().join(','),
        wcStatus: wc.map(x => x.id + ':' + x.status).sort().join(','),
    br: (s.bonus_rules || []).length,
    ba: (s.bonus_awards || []).length,
    baStatus: (s.bonus_awards || []).map(x => x.id + ':' + x.status).sort().join(',')
  });
}

let _syncTimer = null;
let _syncBusy = false;
let _lastHash = '';
function startSmartSync(){
  if(_syncTimer) clearInterval(_syncTimer);
  _lastHash = computeStoreHash(store);
  _syncTimer = setInterval(async () => {
    if(document.hidden) return;
    if(!navigator.onLine) return;
    if(_syncBusy) return;
    // ✅ لا تزامن أثناء الكتابة في حقل
    const el = document.activeElement;
    if(el && ['INPUT','TEXTAREA','SELECT'].includes(el.tagName)) return;
    // ✅ لا تزامن إذا كان sheet مفتوح
    if(!byId('sheet').classList.contains('hidden')) return;
    // ✅ لا تزامن أثناء الكتابة داخل حقل داخل sheet
    if(el && el.closest && el.closest('#sheetCard')) return;
    
    _syncBusy = true;
    try{
      const newStore = await adapter.init();
      const newHash = computeStoreHash(newStore);
      if(newHash !== _lastHash){
        _lastHash = newHash;
        store = newStore;
        renderAll();
        showSyncIndicator('🔄 تم التحديث', 'ok');
        console.log('[Sync] ✅ تحديث تلقائي في', new Date().toLocaleTimeString());
      }
    }catch(ex){
      console.warn('[Sync] فشل:', ex);
      showSyncIndicator('⚠️ فشل المزامنة', 'err');
    }
    _syncBusy = false;
  }, SYNC_INTERVAL_MS);
}

async function boot(){
  let th='dark';
  try{th=localStorage.getItem(THEME_KEY)||'dark'}catch(e){}
  setTheme(th);
  registerServiceWorker();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

  const cfg=loadCloudCfg();
  adapter=cfg?SupabaseAdapter(cfg.url,cfg.key):LocalAdapter;
  try{
    store=await adapter.init();
  }catch(ex){
    console.error(ex);
    toast('تعذر الاتصال بالسحابة — محلي','err');
    adapter=LocalAdapter;
    store=await adapter.init();
  }
  adapter.subscribe(async()=>{
    try{
      const newStore = await adapter.init();
      store = newStore;
      _lastHash = computeStoreHash(store);
      renderAll();
    }catch(ex){console.error(ex)}
  });

  // ✅ بدء المزامنة الذكية (5 ثوانٍ + Hash يشمل التعديلات)
  if(cfg) startSmartSync();

  // ✅ بدء Push Queue (إعادة إرسال الإشعارات الفاشلة)
  PushQueue.start();

  // ✅ مزامنة عند عودة الاتصال
  window.addEventListener('online', () => {
    showSyncIndicator('🌐 عاد الاتصال', 'ok');
    if(cfg && !document.hidden){
      setTimeout(async () => {
        try{
          const newStore = await adapter.init();
          store = newStore;
          _lastHash = computeStoreHash(store);
          renderAll();
          PushQueue.flush();
        }catch(e){ console.warn('[Online Sync]', e); }
      }, 500);
    }
  });

  // ✅ عرض حالة الاتصال
  window.addEventListener('offline', () => {
    showSyncIndicator('📴 لا اتصال', 'err');
  });

  // ✅ استرجع الجلسة من Supabase Auth (فقط في الوضع السحابي)
  if(adapter && adapter.mode === 'cloud' && adapter.sb){
    try{
      const { data: sessData } = await adapter.sb.auth.getSession();

      if(sessData && sessData.session && sessData.session.user){
        // جلب بيانات الموظف عبر الدالة الآمنة (users نفسه مقفول بالكامل)
        const { data: profileRows, error: profErr } = await adapter.sb.rpc('app_current_user');
        const profile = profileRows && profileRows[0];

        if(profile && !profErr){
          user = profile;
          startApp();
        } else {
          // حساب Auth موجود لكن لا سجل مرتبط/غير نشط — سجّل خروج
          await adapter.sb.auth.signOut();
          showLogin();
        }
      } else {
        showLogin();
      }
    }catch(e){
      console.error('Session restore failed:', e);
      showLogin();
    }
  } else {
    showLogin();
  }

  window.__muzn={
    get store(){return store},
    get adapter(){return adapter},
    get user(){return user},
    seedStore,inv,custBal,dSummary,stockWH,materialStock,custody,supplierBal,
    sendPush,sendPushToUsers,sendPushToAdmins,sendPushToOperators,
    subscribeToPush,unsubscribeFromPush,registerServiceWorker,urlBase64ToUint8Array,
    NotificationCenter,PushQueue,
    get ENT(){return ENT},
    get SKEL(){return SKEL},
    get VAPID_PUBLIC_KEY(){return VAPID_PUBLIC_KEY},
    get EDGE_FUNCTION_URL(){return EDGE_FUNCTION_URL},
    requirePerm,requireEdit,requireDelete,
    getShiftTypeByHour,getCurrentShift,calcShiftDurationMinutes,calcShiftDurationHours,
    isEarlyShiftStart,isLateShiftStart,getShiftStats,getTodayShift,getTodayShiftClosed,
    openDistributorShiftSheet,distShiftCheckIn,distShiftCheckOut,distShiftCheckOutForm,
    renderDistShiftsList,
        renderOpShiftChip,openOperatorShiftSheet,operatorShiftCheckIn,
    operatorShiftCheckOut,operatorShiftCheckOutForm,
    computeStoreHash,startSmartSync,showSyncIndicator,
    // 🎁 Bonus helpers
    computeBonusProgress,
    renderBonusCountdown,
    renderAdminBonusOverview,
    describeBonusReward,
    formatTimeLeft,
    getBonusTargets,
    calculateSalesBonuses,
    calculateProductionBonuses
  };
}

/* =====================================================================
   🆕 AUTO-UPDATE SYSTEM — تحديث فوري (15 ثانية بدل 60)
   ===================================================================== */
(function autoUpdater() {
  if (!('serviceWorker' in navigator)) return;
  
  let refreshing = false;
  
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (refreshing) return;
    refreshing = true;
    console.log('[Update] 🔄 New version detected — reloading...');
    try {
      sessionStorage.setItem('muzn_pre_reload', '1');
    } catch(e) {}
    location.reload();
  });
  
  async function checkForUpdate() {
    try {
      const reg = await navigator.serviceWorker.getRegistration();
      if (reg) await reg.update();
    } catch(e) {
      console.warn('[Update] check failed:', e);
    }
  }
  
  // ✅ فحص عند التحميل — 500ms (بدل 2s)
  window.addEventListener('load', () => {
    setTimeout(checkForUpdate, 500);
  });
  
  // ✅ فحص دوري كل 15 ثانية (بدل 60s)
  setInterval(checkForUpdate, 15000);
  
  // ✅ فحص فوري عند العودة للتطبيق
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) checkForUpdate();
  });
  
  // ✅ فحص عند استعادة الاتصال
  window.addEventListener('online', checkForUpdate);
  
  // رسالة نجاح التحديث
  if (sessionStorage.getItem('muzn_pre_reload')) {
    sessionStorage.removeItem('muzn_pre_reload');
    setTimeout(() => {
      if (window.__muzn && window.__muzn.showSyncIndicator) {
        window.__muzn.showSyncIndicator('✅ تم التحديث', 'ok');
      }
      if (window.toast) window.toast('✅ تم تحديث التطبيق','ok');
    }, 800);
  }
})();

<script>
/* ═══════════════════════════════════════════════════════════════
   MUZN BUDDY v6 — Groq + Gemini + OpenRouter + HR ذكي
   ═══════════════════════════════════════════════════════════════ */
(function () {
'use strict';

/* ╔══════════════════════════════════════════════════════════╗
   ║  🔑 المفاتيح — كل الموظفين يستخدمونها تلقائياً          ║
   ╚══════════════════════════════════════════════════════════╝ */
var GROQ_KEY = '';
var GEMINI_KEY = '';
var OPENROUTER_KEY = '';

async function loadAIKeys() {
  try {
    var m = M();
    if (!m || !m.adapter || !m.adapter.sb) return;
    var r = await m.adapter.sb.from('app_config').select('key,value');
    if (r.data) {
      r.data.forEach(function(row){
        if (row.key === 'groq_key'       && row.value) GROQ_KEY = row.value;
        if (row.key === 'gemini_key'     && row.value) GEMINI_KEY = row.value;
        if (row.key === 'openrouter_key' && row.value) OPENROUTER_KEY = row.value;
      });
      var p = [];
      if (GROQ_KEY) p.push('Groq');
      if (GEMINI_KEY) p.push('Gemini');
      if (OPENROUTER_KEY) p.push('OpenRouter');
      console.log('[AI Keys ✅]', p.join(' + ') || 'لا مزود');
    }
  } catch(e) { console.warn('[AI Keys ❌]', e.message); }
}


/* ═══ تخزين ═══ */
var CFG_KEY = 'muzn_buddy_v6_cfg';
var TARGET_KEY = 'muzn_buddy_targets';

function loadCfg() {
  try {
    var r = localStorage.getItem(CFG_KEY);
    if (r) return Object.assign({ voice: true, voiceName: '', rate: 1, history: [] }, JSON.parse(r));
  } catch(e){}
  return { voice: true, voiceName: '', rate: 1, history: [] };
}
var C = loadCfg();
function saveCfg() { try { localStorage.setItem(CFG_KEY, JSON.stringify(C)); } catch(e){} }

function loadTargets() { try { var r = localStorage.getItem(TARGET_KEY); if (r) return JSON.parse(r); } catch(e){} return {}; }
function saveTargets(t) { try { localStorage.setItem(TARGET_KEY, JSON.stringify(t)); } catch(e){} }

/* ═══ أدوات ═══ */
function $(id){ return document.getElementById(id); }
function TODAY() {
  var d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function MONTH(){ return TODAY().slice(0,7); }
function YEAR(){ return TODAY().slice(0,4); }
function r3(n){ return Math.round((Number(n)||0)*1000)/1000; }
function safe(fn, fb) { try { var r = fn(); return r == null ? fb : r; } catch(e){ return fb; } }

function M() { return window.__muzn || null; }
function store() { var m = M(); return m && m.store ? m.store : null; }
function me() { var m = M(); return m && m.user ? m.user : null; }
function cur() { var s = store(); return s && s.company ? (s.company.currency_symbol || '') : ''; }
function fmt(n) {
  var s = store();
  var d = s && s.company ? (s.company.currency_decimals != null ? s.company.currency_decimals : 3) : 3;
  return (Number(n)||0).toFixed(d);
}

var fab, chatEl, bodyEl, chipsEl, inputEl, sendEl, micEl, voiceBtn, statusEl, badgeEl, settingsEl;

/* ═══ الصوت ═══ */
var arVoices = [];
function loadVoices() {
  if (!window.speechSynthesis) return;
  var vs = speechSynthesis.getVoices() || [];
  arVoices = vs.filter(function(v){ return v.lang && v.lang.toLowerCase().indexOf('ar') === 0; });
  arVoices.sort(function(a, b){ return scoreVoice(b) - scoreVoice(a); });
  var sel = $('mzn-voice-select');
  if (!sel) return;
  sel.innerHTML = '';
  if (!arVoices.length) {
    var o = document.createElement('option'); o.textContent = 'لا توجد أصوات عربية'; sel.appendChild(o); return;
  }
  arVoices.forEach(function(v){
    var opt = document.createElement('option');
    opt.value = v.name; opt.textContent = v.name + ' (' + v.lang + ')';
    sel.appendChild(opt);
  });
  if (C.voiceName) sel.value = C.voiceName;
  else if (arVoices[0]) sel.value = arVoices[0].name;
}
function scoreVoice(v) {
  var n = (v.name||'').toLowerCase(); var s = 0;
  if (n.indexOf('neural') >= 0) s += 100;
  if (n.indexOf('natural') >= 0) s += 80;
  if (n.indexOf('online') >= 0) s += 60;
  if (n.indexOf('premium') >= 0) s += 50;
  if (n.indexOf('enhanced') >= 0) s += 40;
  if (n.indexOf('google') >= 0) s += 20;
  var l = (v.lang||'').toLowerCase();
  if (l === 'ar-sa' || l === 'ar-eg' || l === 'ar-ae') s += 25;
  else if (l.indexOf('ar-') === 0) s += 10;
  return s;
}
function getSelectedVoice() {
  if (!arVoices.length) return null;
  var name = C.voiceName || ($('mzn-voice-select') && $('mzn-voice-select').value);
  if (name) for (var i=0;i<arVoices.length;i++) if (arVoices[i].name === name) return arVoices[i];
  return arVoices[0];
}
if (window.speechSynthesis) {
  speechSynthesis.onvoiceschanged = loadVoices;
  setTimeout(loadVoices, 200);
  setTimeout(loadVoices, 1000);
  setTimeout(loadVoices, 2500);
}
function splitSentences(text) {
  var clean = String(text||'')
    .replace(/\*([^*]+)\*/g, '$1')
    .replace(/[🦉📊💰✅⚠️🔴🟢🎯📦📋💳🎁📢👋☀️🌙🌤️🌆💪✨😊😉👀🌟➤🥇🥈🥉⏳💵💼🏆📈🎤⚙️🔊🔇💡🎉]/g, '')
    .replace(/—/g, '،').replace(/\s+/g, ' ').trim();
  return clean.split(/(?<=[.!؟،:])\s+/).filter(function(s){ return s.trim().length > 1; });
}
function speak(text) {
  if (!C.voice || !window.speechSynthesis) return;
  try {
    var parts = splitSentences(text);
    if (!parts.length) return;
    speechSynthesis.cancel();
    var voice = getSelectedVoice();
    parts.forEach(function(p){
      var u = new SpeechSynthesisUtterance(p);
      u.lang = voice ? voice.lang : 'ar-SA';
      if (voice) u.voice = voice;
      u.rate = Number(C.rate) || 1;
      u.pitch = 1.05;
      speechSynthesis.speak(u);
    });
  } catch(e){}
}
function stopSpeak() { if (window.speechSynthesis) try { speechSynthesis.cancel(); } catch(e){} }

/* ═══ قراءة البيانات ═══ */
function saleTotal(h) { return (h.items||[]).reduce(function(s,it){ return s + (it.qty*it.price - (it.discount||0)); }, 0); }
function salesInRange(from, to, userName) {
  var s = store(); if (!s) return [];
  return (s.sales||[]).filter(function(h){
    if (userName && h.by !== userName) return false;
    return h.date >= from && h.date <= to;
  });
}
function salesToday(u) { return salesInRange(TODAY(), TODAY(), u); }
function salesMonth(u) { var m = MONTH(); return salesInRange(m+'-01', m+'-31', u); }
function salesYear(u) { return salesInRange(YEAR()+'-01-01', YEAR()+'-12-31', u); }
function salesWeek(u) {
  var d = new Date(); var day = d.getDay();
  var diff = day === 6 ? 0 : day + 1;
  var start = new Date(d); start.setDate(d.getDate() - diff);
  var end = new Date(start); end.setDate(start.getDate() + 6);
  var fd = function(x){ return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); };
  return salesInRange(fd(start), fd(end), u);
}
function sumSales(a) { return a.reduce(function(t,h){ return t + saleTotal(h); }, 0); }
function topProduct(a) {
  var agg = {};
  a.forEach(function(h){ (h.items||[]).forEach(function(it){ agg[it.product_id] = (agg[it.product_id]||0) + it.qty; }); });
  var best = null;
  for (var p in agg) if (!best || agg[p] > agg[best]) best = p;
  if (!best) return null;
  var prod = safe(function(){ return store().products.find(function(x){ return x.id === best; }); }, null);
  return prod ? { name: prod.name, qty: agg[best] } : null;
}
function paidToday() {
  var s = store(); if (!s) return [];
  return (s.payments||[]).filter(function(p){ return p.date === TODAY(); });
}
function remittedToday() {
  var s = store(); if (!s) return [];
  return (s.remittances||[]).filter(function(r){ return r.date === TODAY(); });
}
function distsNotRemittedToday() {
  var s = store(); if (!s) return [];
  var ids = {};
  remittedToday().forEach(function(r){ ids[r.distributor_id] = true; });
  return (s.distributors||[]).filter(function(d){ return !ids[d.id]; });
}
function overdueCustomers() {
  var m = M(), s = store();
  if (!s) return [];
  var out = [];
  (s.customers||[]).forEach(function(c){
    var b = safe(function(){ return m && m.custBal ? m.custBal(s, c) : null; }, null);
    if (b && b.bucket === 'overdue' && b.remaining > 0.009) {
      out.push({ c: c, remaining: b.remaining, due: b.due });
    }
  });
  return out.sort(function(a,b){ return b.remaining - a.remaining; });
}
function distsWithDebt() {
  var m = M(), s = store();
  if (!s) return [];
  var out = [];
  (s.distributors||[]).forEach(function(d){
    var bal = safe(function(){ return m && m.dSummary ? m.dSummary(s, d).bal : null; }, null);
    if (bal != null && bal > 0.009) out.push({ d: d, bal: bal });
  });
  return out.sort(function(a,b){ return b.bal - a.bal; });
}
function lowStock() {
  var m = M(), s = store();
  if (!s) return { products: [], materials: [] };
  var ps = (s.products||[]).filter(function(p){
    if (!p.min_stock) return false;
    var q = safe(function(){ return m && m.stockWH ? m.stockWH(s, p.id) : null; }, null);
    return q != null && q < p.min_stock;
  }).map(function(p){ return { name: p.name, have: safe(function(){ return m.stockWH(s,p.id); },0), min: p.min_stock }; });
  var ms = (s.materials||[]).filter(function(mat){
    if (!mat.min_stock) return false;
    var q = safe(function(){ return m && m.materialStock ? m.materialStock(s, mat.id) : null; }, null);
    return q != null && q < mat.min_stock;
  }).map(function(mat){ return { name: mat.name, have: safe(function(){ return m.materialStock(s,mat.id); },0), min: mat.min_stock }; });
  return { products: ps, materials: ms };
}
function pendingPRs() {
  var s = store(); if (!s) return [];
  return (s.purchase_requests||[]).filter(function(r){ return r.status === 'pending'; });
}
function getTarget(name) { var t = loadTargets(); return t[name] || 0; }
function setTarget(name, amount) { var t = loadTargets(); t[name] = Number(amount)||0; saveTargets(t); }
function myTarget() { var u = me(); return u ? getTarget(u.name) : 0; }

function getRole() {
  var u = me();
  if (!u) return 'guest';
  if (u.role === 'admin') return 'admin';
  var p = u.perms || [];
  if (p.indexOf('sales') >= 0)        return 'sales';
  if (p.indexOf('production') >= 0)   return 'production';
  if (p.indexOf('withdrawals') >= 0)  return 'warehouse';
  if (p.indexOf('purchases') >= 0)    return 'purchases';
  if (p.indexOf('collections') >= 0)  return 'collections';
  if (p.indexOf('distributors') >= 0) return 'distributors';
  return 'staff';
}
function canAccess(cat) {
  var role = getRole();
  if (role === 'admin') return true;
  var map = {
    sales: ['sales','collections','distributors'],
    production: ['production'],
    warehouse: ['warehouse'],
    purchases: ['purchases','warehouse'],
    collections: ['collections','sales','distributors'],
    distributors: ['distributors','collections','sales'],
    staff: ['sales','production','warehouse']
  };
  return (map[role]||[]).indexOf(cat) >= 0;
}
function denyMsg(cat) {
  var map = { sales:'المبيعات', production:'الإنتاج', warehouse:'المخزون', purchases:'المشتريات', collections:'التحصيل', distributors:'الموزعين', debts:'الديون' };
  return '🔒 قسم "' + (map[cat]||cat) + '" خارج صلاحياتك.';
}

/* ═══════════════════════════════════════════════════════════
   👥 دوال HR
   ═══════════════════════════════════════════════════════════ */
function avgDailySales(userName, days) {
  var total = 0, count = 0;
  for (var i = 1; i <= days; i++) {
    var d = new Date(); d.setDate(d.getDate() - i);
    var ds = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    var arr = salesInRange(ds, ds, userName);
    if (arr.length) { total += sumSales(arr); count++; }
  }
  return count > 0 ? total / count : 0;
}
function suggestTarget(userName) {
  var avg30 = avgDailySales(userName, 30);
  var avg7  = avgDailySales(userName, 7);
  var avg = avg30 > 0 ? (avg30 * 0.7 + avg7 * 0.3) : avg7;
  if (avg <= 0) {
    return { daily: DEFAULT_DAILY_TARGET, weekly: DEFAULT_DAILY_TARGET*7, monthly: DEFAULT_DAILY_TARGET*30, reason: 'لا توجد بيانات كافية — هدف ابتدائي' };
  }
  var daily = Math.ceil((avg * (1 + TARGET_RAISE_PCT/100)) / 50) * 50;
  return {
    daily: daily, weekly: daily*7, monthly: daily*30,
    avg7: Math.round(avg7), avg30: Math.round(avg30),
    reason: 'متوسطك اليومي: ' + Math.round(avg30) + ' — رفعت الهدف ' + TARGET_RAISE_PCT + '% للتحدي'
  };
}
function closeMyShift() {
  var m = M(), s = store(), u = me();
  if (!s || !u) return { ok: false, msg: 'سجّل دخولك.' };
  var t = TODAY();

function norm(t) {
  return String(t||'').toLowerCase()
    .replace(/[إأآا]/g, 'ا').replace(/ى/g, 'ي').replace(/ة/g, 'ه')
    .replace(/[ًٌٍَُِّْ]/g, '').replace(/[?؟!.,،;؛:]/g, '').trim();
}
function has(text) {
  var t = norm(text);
  for (var i = 1; i < arguments.length; i++) if (t.indexOf(norm(arguments[i])) >= 0) return true;
  return false;
}
function anyHas(t, arr) { for (var i=0;i<arr.length;i++) if (has(t, arr[i])) return true; return false; }

function detectIntent(raw) {

  /* HR */
  if (has(t,'اقترح') && has(t,'هدف')) add('suggest_target', 110);

  if (has(t,'من') && has(t,'مستحق') && has(t,'مكافاه')) add('team_rewards', 90);

  var best = null, bs = 0;
  for (var k in s) if (s[k] > bs) { bs = s[k]; best = k; }
  return { intent: best, score: bs };
}

function buildSystemPrompt() {
  var u = me(); var s = store(); var cn = cur(); var role = getRole();
  var isAdmin = u && u.role === 'admin'; var un = u ? u.name : null;

  var ctx = {
    الشركة: (s && s.company && s.company.name) || 'MUZN',
    اليوم: TODAY(), الشهر: MONTH(), السنة: YEAR(),
    المستخدم: un || 'زائر', الدور: role, العملة: cn
  };

  var sT = isAdmin ? salesToday() : salesToday(un);
  var sM = isAdmin ? salesMonth() : salesMonth(un);
  var sY = isAdmin ? salesYear() : salesYear(un);
  ctx.مبيعات_اليوم = { فواتير: sT.length, إجمالي: r3(sumSales(sT)) };
  ctx.مبيعات_الشهر = { فواتير: sM.length, إجمالي: r3(sumSales(sM)) };
  ctx.مبيعات_السنة = { فواتير: sY.length, إجمالي: r3(sumSales(sY)) };

  if (isAdmin && s) {
    var it = s.sale_items_flat || [];
    var rev = it.reduce(function(t,x){ return t + (x.qty*x.price-(x.discount||0)); }, 0);
    var cost = it.reduce(function(t,x){ var p = s.products.find(function(y){return y.id===x.product_id;})||{}; return t + x.qty*(p.dist_price||p.price||0); }, 0);
    ctx.الأرباح_الإجمالية = { إيراد: r3(rev), تكلفة: r3(cost), ربح: r3(rev-cost) };
    var bd = {};
    it.filter(function(x){ return x.date === TODAY(); }).forEach(function(x){
      var k = x.distributor_id || '__d__';
      bd[k] = (bd[k]||0) + (x.qty*x.price-(x.discount||0));
    });
    ctx.مبيعات_اليوم_حسب_الموزع = Object.keys(bd).map(function(k){
      var d = k === '__d__' ? {name:'بيع مباشر'} : ((s.distributors||[]).find(function(y){return y.id===k;})||{name:'؟'});
      return d.name + ': ' + r3(bd[k]);
    }).join(' | ');
  }

  var ov = overdueCustomers();
  ctx.عملاء_متأخرون = { عدد: ov.length, قائمة: ov.slice(0,10).map(function(x){ return x.c.name + ' (' + r3(x.remaining) + ')'; }).join('، ') };

  var dd = distsWithDebt();
  ctx.ديون_الموزعين = { عدد: dd.length, قائمة: dd.slice(0,10).map(function(x){ return x.d.name + ' (' + r3(x.bal) + ')'; }).join('، ') };

  var ls = lowStock();
  ctx.نواقص = { منتجات: ls.products.slice(0,8).map(function(p){ return p.name; }).join('، '), مواد: ls.materials.slice(0,8).map(function(m){ return m.name; }).join('، ') };
  ctx.طلبات_معلقة = pendingPRs().length;
  var tgt = myTarget();
  if (tgt) ctx.هدفي = { القيمة: tgt, أنجزت: r3(sumSales(sT)) };

  var lc = isLateToday();
  if (lc && !lc.noShift) ctx.ورديتي = { بدأت: lc.time, متأخر: lc.late, مغلقة: lc.closed };

  return [
    'أنت "مُزن" 🦉 — مساعد ذكي ودود في MUZN Operations (إدارة مبيعات وإنتاج في ليبيا).',
    '',
    'شخصيتك:',
    '- عربي بأسلوب ودود، محفّز، مختصر',
    '- تجيب بالتفصيل عند الحاجة، باختصار عند عدمها',
    '- أرقام حقيقية من السياق فقط — لا تختلق',
    '- إيموجي باعتدال',
    '',
    '📊 البيانات الآن:',
    JSON.stringify(ctx, null, 2),
    '',
    'قواعد:',
    '1. دور المستخدم "' + role + '" — احترم الصلاحيات',
    '2. العملة: ' + cn,
    '3. لا تخترع أرقاماً',
    '4. أجب بالعربية الليبية/الفصحى المبسّطة'
  ].join('\n');
}

function askGroq(userMsg, history) {
  if (!GROQ_KEY) return Promise.reject(new Error('no groq key'));
  var msgs = [{ role: 'system', content: buildSystemPrompt() }];
  (history||[]).slice(-8).forEach(function(h){ msgs.push({ role: h.role === 'user' ? 'user' : 'assistant', content: String(h.text||'').slice(0,800) }); });
  msgs.push({ role: 'user', content: userMsg });
  return fetch('https://api.groq.com/openai/v1/chat/completions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + GROQ_KEY },
    body: JSON.stringify({ model: 'llama-3.3-70b-versatile', messages: msgs, temperature: 0.75, max_tokens: 800, top_p: 0.95 })
  }).then(function(r){
    return r.json().then(function(d){
      if (!r.ok) throw new Error((d.error && d.error.message) || ('HTTP ' + r.status));
      var t = d.choices && d.choices[0] && d.choices[0].message && d.choices[0].message.content;
      if (!t) throw new Error('empty');
      return t.trim();
    });
  });
}

function askGemini(userMsg, history) {
  if (!GEMINI_KEY) return Promise.reject(new Error('no gemini key'));

  function tryM(i) {

    return fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },

        contents: contents,

          { category: 'HARM_CATEGORY_HARASSMENT', threshold: 'BLOCK_NONE' },
          { category: 'HARM_CATEGORY_HATE_SPEECH', threshold: 'BLOCK_NONE' },
          { category: 'HARM_CATEGORY_SEXUALLY_EXPLICIT', threshold: 'BLOCK_NONE' },

    }).then(function(r){ return r.json().then(function(d){

function askAI(userMsg, history) {
  var chain = [];
  if (GROQ_KEY)       chain.push({ name: 'Groq',       fn: askGroq });
  if (GEMINI_KEY)     chain.push({ name: 'Gemini',     fn: askGemini });
  if (OPENROUTER_KEY) chain.push({ name: 'OpenRouter', fn: askOpenRouter });
  if (!chain.length) return Promise.reject(new Error('no provider'));

  function tryN(i) {
    if (i >= chain.length) return Promise.reject(new Error('all failed'));
    var p = chain[i];
    return p.fn(userMsg, history)
      .then(function(r){ console.log('[AI ✅]', p.name); return r; })
      .catch(function(e){ console.warn('[AI ❌]', p.name, e.message); return tryN(i + 1); });
  }
  return tryN(0);
}

function addMsg(text, from) {
  var div = document.createElement('div');
  div.className = 'mzn-msg ' + (from === 'me' ? 'me' : 'bot');
  var html = String(text).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\*(.+?)\*/g, '<b>$1</b>').replace(/\n/g, '<br>');
  div.innerHTML = html;
  bodyEl.appendChild(div);
  bodyEl.scrollTop = bodyEl.scrollHeight;
  return div;
}

  if (!parent) return;
  var w = document.createElement('div');
  w.innerHTML = '<div class="prog"><i style="width:' + pct + '%"></i></div><div class="bar-label"><span>0%</span><span>' + pct + '%</span><span>100%</span></div>';
  parent.appendChild(w);
  bodyEl.scrollTop = bodyEl.scrollHeight;
}
function showTyping() {
  var t = document.createElement('div'); t.className = 'mzn-typing'; t.id = 'mzn-typing';
  t.innerHTML = '<i></i><i></i><i></i>'; bodyEl.appendChild(t); bodyEl.scrollTop = bodyEl.scrollHeight;
}
function hideTyping() { var t = $('mzn-typing'); if (t) t.remove(); }

function botSay(text, opts) {
  opts = opts || {};
  showTyping(); fab.classList.add('talking'); statusEl.textContent = 'يكتب...';
  var delay = Math.min(350 + text.length * 6, 900);
  setTimeout(function(){
    hideTyping();
    var el = addMsg(text, 'bot');
    if (opts.progress != null) addProgress(el, opts.progress);
    fab.classList.remove('talking');
    statusEl.textContent = 'مساعدك الذكي 🦉';
    if (C.voice) speak(opts.speakText || text);
  }, delay);
}

function sendMessage(raw) {
  var text = String(raw||'').trim();
  if (!text) return;
  addMsg(text, 'me');
  inputEl.value = '';
  C.history = (C.history || []).slice(-20);
  C.history.push({ role: 'user', text: text, ts: Date.now() });

  var det = detectIntent(text);
  var quick = buildReply(det.intent, text);
  if (quick && quick.text && det.score >= 60) {
    botSay(quick.text, { progress: quick.progress });
    C.history.push({ role: 'bot', text: quick.text, ts: Date.now() });
    saveCfg();
    return;
  }

  statusEl.textContent = '🤔 يفكّر...';
  askAI(text, C.history.slice(0, -1))
    .then(function(reply){
      botSay(reply);
      C.history.push({ role: 'bot', text: reply, ts: Date.now() });
      saveCfg();
    })
    .catch(function(err){
      console.warn('[AI final]', err.message);
      var det2 = detectIntent(text);
      var r = buildReply(det2.intent, text);
      if (r && r.text) botSay(r.text);
      else botSay('ما قدرت أفهم 🤔\nجرّب:\n• "مبيعاتي اليوم"\n• "الديون"\n• "اقترح لي هدف"\n• "اشرح لي"');
      C.history.push({ role: 'bot', text: '(error)', ts: Date.now() });
      saveCfg();
    });
}

function buildChips() {
  var role = getRole();
  var chips;
  if (role === 'admin') chips = ['مبيعات اليوم','مبيعات الشهر','مبيعات السنة','أرباح','من دفع اليوم','من لم يسلّم','الديون','مكافآت الفريق','استشارة','المخزون','اقترح لي هدف','قارن الشهور','اشرح لي'];
  else if (role === 'production') chips = ['مبيعاتي اليوم','مبيعاتي الشهر','هدفي','حلل أدائي','ورديتي اليوم','هل تأخرت','كم يوم غبت','اشرح لي'];
  else if (role === 'warehouse') chips = ['المخزون','طلبات النواقص','اشرح لي'];
  else if (role === 'purchases') chips = ['المخزون','طلبات النواقص','اشرح لي'];
  else if (role === 'sales' || role === 'collections') chips = ['مبيعاتي اليوم','مبيعاتي الشهر','من دفع اليوم','الديون','هدفي','اقترح لي هدف','ورديتي اليوم','هل تأخرت','كم يوم غبت','أغلق ورديتي','اشرح لي'];
  else if (role === 'distributors') chips = ['مبيعاتي اليوم','الديون','من لم يسلّم','ورديتي اليوم','هل تأخرت','اشرح لي'];
  else chips = ['مبيعاتي اليوم','هدفي','اشرح لي'];
  chipsEl.innerHTML = '';
  chips.forEach(function(c){
    var b = document.createElement('button');
    b.textContent = c;
    b.onclick = function(){ sendMessage(c); };
    chipsEl.appendChild(b);
  });
}

function smartGreeting() {
  var u = me();
  if (!u) return 'أهلاً 👋 سجّل دخولك.';
  var name = u.name.split(' ')[0];
  var h = new Date().getHours();
  var t = h<12 ? 'صباح الخير ☀️' : h<18 ? 'مساء الخير 🌤️' : 'مساء النجاح 🌆';
  var cn = cur(); var role = getRole();
  var lines = [t + ' ' + name + '! 🦉'];

  var lc = isLateToday();
  if (lc && !lc.noShift) {
    if (lc.late) lines.push('⚠️ تأخرت اليوم — بدأت ' + lc.time);
    else if (lc.early) lines.push('🌅 جيت بدري اليوم!');
  } else if (lc && lc.noShift) lines.push('⏸️ ما سجّلت حضورك اليوم.');

  var arrT = role === 'admin' ? salesToday() : salesToday(u.name);
  var tt = sumSales(arrT);
  if (arrT.length) lines.push('💰 اليوم: ' + arrT.length + ' فاتورة — ' + fmt(tt) + ' ' + cn);
  else lines.push('ما فيه مبيعات لسّه.');

  var tgt = myTarget();
  if (tgt) {
    var pct = Math.min(Math.round(tt/tgt*100),100);
    var rem = Math.max(tgt-tt,0);
    if (pct >= 100) lines.push('🎉 حققت هدفك!');
    else lines.push('🎯 هدفك ' + fmt(tgt) + ' — ' + pct + '%');
  } else if (role === 'admin') lines.push('قول "اقترح لي هدف" وأحسبه من أدائك.');

  var ls = lowStock();
  if (ls.products.length + ls.materials.length) lines.push('⚠️ عندك نواقص.');
  var ov = overdueCustomers();
  if (ov.length) lines.push('💳 ' + ov.length + ' عميل متأخر — اسأل "الديون".');

  lines.push('\nاسألني 👇');
  return lines.join('\n');
}

var greeted = false;
function openChat() {
  chatEl.classList.add('open');
  if (!greeted) { greeted = true; setTimeout(function(){ botSay(smartGreeting()); }, 350); }
  setTimeout(function(){ inputEl.focus(); }, 300);
}
function closeChat() { chatEl.classList.remove('open'); stopSpeak(); if (settingsEl) settingsEl.classList.remove('open'); }
function openSettings() {
  settingsEl.classList.add('open');
  loadVoices();
  $('mzn-voice-rate').value = C.rate || 1;
  updateProviderStatus();
}
function closeSettings() { settingsEl.classList.remove('open'); }
function saveSettings() {
  C.rate = parseFloat($('mzn-voice-rate').value) || 1;
  C.voiceName = $('mzn-voice-select').value || '';
  saveCfg();
  closeSettings();
  botSay('✅ تم الحفظ.');
}
function updateProviderStatus() {
  $('mzn-st-groq').className   = 'status ' + (GROQ_KEY ? 'on' : 'off');
  $('mzn-st-gemini').className = 'status ' + (GEMINI_KEY ? 'on' : 'off');
  $('mzn-st-or').className     = 'status ' + (OPENROUTER_KEY ? 'on' : 'off');
}

function boot() {
  fab = $('mzn-fab'); chatEl = $('mzn-chat'); bodyEl = $('mzn-body');
  chipsEl = $('mzn-chips'); inputEl = $('mzn-input'); sendEl = $('mzn-send');
  micEl = $('mzn-mic'); voiceBtn = $('mzn-voice'); statusEl = $('mzn-status');
  badgeEl = $('mzn-badge'); settingsEl = $('mzn-settings');
  if (!fab) return;

  var prov = [];
  if (GROQ_KEY) prov.push('Groq');
  if (GEMINI_KEY) prov.push('Gemini');
  if (OPENROUTER_KEY) prov.push('OpenRouter');
  console.log('[MUZN Buddy v6] مزودو AI:', prov.length ? prov.join(' + ') : 'قاعدة فقط');

  fab.onclick = openChat;
  $('mzn-chat-bg').onclick = closeChat;
  $('mzn-close').onclick = closeChat;
  $('mzn-settings-btn').onclick = openSettings;
  $('mzn-settings-close').onclick = closeSettings;
  $('mzn-settings-save').onclick = saveSettings;
  $('mzn-test-voice').onclick = function(){
    var old = C.voice; C.voice = true;
    speak('مرحباً، أنا مُزن، مساعدك الذكي في تطبيق مُزن أوبراشنز.');
    setTimeout(function(){ C.voice = old; }, 5000);
  };

  sendEl.onclick = function(){ sendMessage(inputEl.value); };
  inputEl.addEventListener('keydown', function(e){
    if (e.key === 'Enter') { e.preventDefault(); sendMessage(inputEl.value); }
  });
  voiceBtn.onclick = function(){
    C.voice = !C.voice; saveCfg();
    voiceBtn.classList.toggle('off', !C.voice);
    voiceBtn.textContent = C.voice ? '🔊' : '🔇';
    if (!C.voice) stopSpeak();
  };
  if (!C.voice) { voiceBtn.classList.add('off'); voiceBtn.textContent = '🔇'; }

  var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    var recog = new SR();
    recog.lang = 'ar-SA'; recog.interimResults = false;
    var rec = false;
    micEl.onclick = function(){
      if (rec) { try { recog.stop(); } catch(e){} return; }
      try { recog.start(); } catch(e){ botSay('تعذّر تفعيل المايك'); }
    };
    recog.onstart = function(){ rec = true; micEl.classList.add('rec'); statusEl.textContent = '🎤 استماع...'; };
    recog.onend = function(){ rec = false; micEl.classList.remove('rec'); statusEl.textContent = 'مساعدك 🦉'; };
    recog.onerror = function(){ rec = false; micEl.classList.remove('rec'); };
    recog.onresult = function(e){
      var t = e.results[0][0].transcript;
      inputEl.value = t;
      setTimeout(function(){ sendMessage(t); }, 200);
    };
  } else { micEl.style.opacity = '.4'; }

  buildChips();
  updateBadge();
  setInterval(updateBadge, 30000);

  var w = setInterval(function(){
    if (window.__muzn && window.__muzn.user) {
      clearInterval(w); buildChips(); updateBadge();
    }
  }, 1000);
  setTimeout(function(){ clearInterval(w); }, 30000);
}

function updateBadge() {
  var n = lowStock().products.length + lowStock().materials.length + overdueCustomers().length + pendingPRs().length;
  if (n > 0) { badgeEl.hidden = false; badgeEl.textContent = n > 9 ? '9+' : String(n); }
  else badgeEl.hidden = true;
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else 
  loadAIKeys();
  boot();

})();
</script>
