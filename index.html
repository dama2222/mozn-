    s.id='v-'+m.id;
    s.innerHTML=SKEL[m.id];
    main.appendChild(s);
  });
  al.forEach(m=>{if(MOUNT[m.id])MOUNT[m.id]()});
  buildNav();
  renderAll();
  go(tab||(al[0]&&al[0].id));
}

/* =====================================================================
   معالج النقرات العام
   ===================================================================== */
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-tab],[data-go],.pill,.kcard,[data-more],[data-ent],[data-ent-new],#recBtn');
  if(!t)return;
  if(t.id==='recBtn'){byId('settle').scrollIntoView({behavior:'smooth',block:'start'});return}
  if(t.dataset.tab){t.dataset.tab==='__more'?moreSheet():go(t.dataset.tab);return}
  if(t.dataset.go){closeSheet();go(t.dataset.go);return}
  if(t.dataset.more){ui.lim[t.dataset.more]=(ui.lim[t.dataset.more]||20)+20;renderAll();return}
  if(t.classList.contains('pill')){ui.f[t.dataset.f]=t.dataset.k;renderAll();return}
  if(t.classList.contains('kcard')){
    const c=store.customers.find(x=>x.id===t.dataset.cust);
    if(c&&custBal(store,c).remaining<=0){toast('مسدد بالكامل');return}
    forms.forEach(f=>{if(f.id==='qf')f.set('customer_id',t.dataset.cust)});
    byId('settle').scrollIntoView({behavior:'smooth',block:'start'});
    return;
  }
  if(t.dataset.ent){entSheet(t.dataset.ent,t.dataset.id);return}
  if(t.dataset.entNew){entSheet(t.dataset.entNew,null);return}
});

/* =====================================================================
   Push Notifications
   ===================================================================== */
function urlBase64ToUint8Array(base64String){
  const padding='='.repeat((4-base64String.length%4)%4);
  const base64=(base64String+padding).replace(/-/g,'+').replace(/_/g,'/');
  const raw=atob(base64);
  const arr=new Uint8Array(raw.length);
  for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);
  return arr;
}

async function registerServiceWorker(){
  if(!('serviceWorker' in navigator))return null;
  try{
    const reg=await navigator.serviceWorker.register('sw.js',{scope:'./'});
    console.log('[PWA] SW registered:',reg.scope);
    return reg;
  }catch(e){
    console.error('[PWA] SW register failed:',e);
    return null;
  }
}

async function subscribeToPush(){
  if(!('serviceWorker' in navigator)||!('PushManager' in window)){
    toast('متصفحك لا يدعم الإشعارات','err');
    return false;
  }
  if(Notification.permission!=='granted'){
    const perm=await Notification.requestPermission();
    if(perm!=='granted'){
      toast('تم رفض إذن الإشعارات','err');
      return false;
    }
  }
  try{
    const reg=await navigator.serviceWorker.ready;
    let sub=await reg.pushManager.getSubscription();
    if(!sub){
      sub=await reg.pushManager.subscribe({
        userVisibleOnly:true,
        applicationServerKey:urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
      });
    }
    const json=sub.toJSON();
    const row={
      id:uuid(),
      user_id:user.id,
      endpoint:json.endpoint,
      keys:json.keys,
      platform:'web',
      created_at:Date.now(),
      last_used:Date.now()
    };
    try{await adapter.saveSimple('push_subscriptions',row)}
    catch(ex){console.log('already subscribed or error:',ex.message)}
    try{localStorage.setItem('muzn_push_enabled','1')}catch(e){}
    return true;
  }catch(e){
    console.error('subscribeToPush error:',e);
    toast('تعذر تفعيل الإشعارات: '+e.message,'err');
    return false;
  }
}

async function unsubscribeFromPush(){
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=await reg.pushManager.getSubscription();
    if(sub){
      const endpoint=sub.endpoint;
      await sub.unsubscribe();
      try{
        const all=await adapter.sb.from('push_subscriptions').select('id').eq('endpoint',endpoint);
        if(all.data)for(const r of all.data){
          await adapter.sb.from('push_subscriptions').delete().eq('id',r.id);
        }
      }catch(e){console.warn('delete sub failed',e)}
    }
    try{localStorage.removeItem('muzn_push_enabled')}catch(e){}
    toast('تم إيقاف الإشعارات');
    return true;
  }catch(e){
    console.error(e);
    return false;
  }
}

/* =====================================================================
   boot
   ===================================================================== */
async function boot(){
  let th='dark';
  try{th=localStorage.getItem(THEME_KEY)||'dark'}catch(e){}
  setTheme(th);
  registerServiceWorker();
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

  const cfg=loadCloudCfg();
  adapter=cfg?SupabaseAdapter(cfg.url,cfg.key):LocalAdapter;
  try{
    store=await adapter.init();
  }catch(ex){
    console.error(ex);
    toast('تعذر الاتصال بالسحابة — محلي','err');
    adapter=LocalAdapter;
    store=await adapter.init();
  }
  adapter.subscribe(async()=>{
    try{
      // عند التحديث من السحابة، أعد بناء الفهارس كاملة
      const prevStore = store;
      const newStore = await adapter.init();
      store = newStore;
      renderAll();
    }catch(ex){console.error(ex)}
  });

  let sid=null;
  try{sid=JSON.parse(localStorage.getItem(SESSKEY)||'null')}catch(e){}
  const u=sid&&store.users.find(x=>x.id===sid.id&&x.active);
  if(u){
    user=omit(u,['salt','hash']);
    startApp();
  }else{
    showLogin();
  }

  // ✅ Expose للتشخيص
  window.__muzn={
    get store(){return store},
    get adapter(){return adapter},
    get user(){return user},
    seedStore,inv,custBal,dSummary,stockWH,materialStock,custody,supplierBal,
    sendPush,sendPushToUsers,sendPushToAdmins,sendPushToOperators,
    subscribeToPush,unsubscribeFromPush,registerServiceWorker,urlBase64ToUint8Array,
    NotificationCenter,
    get ENT(){return ENT},
    get SKEL(){return SKEL},
    get VAPID_PUBLIC_KEY(){return VAPID_PUBLIC_KEY},
    get EDGE_FUNCTION_URL(){return EDGE_FUNCTION_URL},
    requirePerm,requireEdit,requireDelete
  };
}
boot();

})();
