/* ---- تقويم الرئيسية: معدل البيع ومعدل الربح (أيام / أشهر / سنوات) ---- */
function ovAgg(){
  const day={},mon={},yr={};
  store.sale_items_flat.forEach(it=>{
    const rev=saleItemNet(it),co=saleItemCoRev(it,it.distributor_id),pf=co-saleItemCost(it);
    [[day,it.date],[mon,it.date.slice(0,7)],[yr,it.date.slice(0,4)]].forEach(x=>{
      const a=x[0][x[1]]||(x[0][x[1]]={rev:0,co:0,pf:0,inv:new Set()});
      a.rev+=rev;a.co+=co;a.pf+=pf;a.inv.add(it.header_id);
    });
  });
  return{day,mon,yr};
}
function ovSumTiles(a,activeDays){
  a=a||{rev:0,co:0,pf:0,inv:new Set()};
  const margin=a.co?a.pf/a.co*100:0;
  return calTile('المبيعات',money(a.rev))+calTile('إيراد الشركة (جملة)',money(a.co))+
    calTile('صافي الربح','<span class="'+(a.pf>=0?'up':'dn')+'">'+money(a.pf)+'</span>')+
    calTile('معدل الربح','<span class="'+(margin>=0?'up':'dn')+'">'+margin.toFixed(1)+'%</span>')+
    calTile('عدد الفواتير',a.inv.size)+calTile('متوسط المبيعات / يوم',activeDays?money(a.rev/activeDays):'—');
}
function ovCalHTML(){
  const st=calState('ov'),mode=st.mode||'day',A=ovAgg(),t=today();
  const years=calYears(store.sale_items_flat.map(s=>s.date).concat([st.y+'-01-01']));
  const modes='<div class="cal-modes">'+[['day','أيام'],['month','أشهر'],['year','سنوات']].map(x=>
    '<button type="button" class="cb'+(mode===x[0]?' on':'')+'" data-cal="ov" data-act="mode" data-d="'+x[0]+'">'+x[1]+'</button>').join('')+
    '<button type="button" class="cb today" data-cal="ov" data-act="today">اليوم</button></div>';
  const tile=(label,a,d)=>'<button type="button" class="cal-tile'+(a?' has':'')+'" data-cal="ov" data-act="drill" data-d="'+d+'"><b>'+label+'</b>'+
    (a?'<span>'+calShort(a.rev)+'</span><span class="'+(a.pf>=0?'up':'dn')+'">'+calShort(a.pf)+'</span>':'<span class="mut">—</span>')+'</button>';
  if(mode==='day'){
    const ym=st.y+'-'+pad(st.m+1);
    const act=Object.keys(A.day).filter(k=>k.slice(0,7)===ym).length;
    const grid=calGridHTML('ov',st,(ds,d)=>{
      const a=A.day[ds];
      return '<button type="button" class="cal-cell big'+(ds===t?' today':'')+(a?' has':'')+'" data-cal="ov" data-act="day" data-d="'+ds+'"><span>'+d+'</span>'+
        (a?'<span class="cal-amt">'+calShort(a.rev)+'</span><span class="cal-pf '+(a.pf>=0?'up':'dn')+'">'+calShort(a.pf)+'</span>':'')+'</button>';
    });
    return modes+calNavHTML('ov',st,years,true,true)+
      '<div class="cal-title">'+CAL_MONTHS[st.m]+' '+st.y+'</div><div class="cal-sum">'+ovSumTiles(A.mon[ym],act)+'</div>'+grid+
      '<div class="cal-leg"><span>السطر الأول: المبيعات</span><span>السطر الثاني: الربح</span></div>';
  }
  if(mode==='month'){
    const act=Object.keys(A.day).filter(k=>k.slice(0,4)===String(st.y)).length;
    let tiles='';for(let m=0;m<12;m++){const ym=st.y+'-'+pad(m+1);tiles+=tile(CAL_MONTHS[m],A.mon[ym],ym)}
    return modes+calNavHTML('ov',st,years,false,true)+
      '<div class="cal-title">سنة '+st.y+'</div><div class="cal-sum">'+ovSumTiles(A.yr[String(st.y)],act)+'</div>'+
      '<div class="cal-tiles">'+tiles+'</div><div class="cal-leg"><span>السطر الأول: المبيعات</span><span>السطر الثاني: الربح</span><span>اضغط شهراً لعرض أيامه</span></div>';
  }
  const all={rev:0,co:0,pf:0,inv:new Set()};
  Object.keys(A.yr).forEach(k=>{const a=A.yr[k];all.rev+=a.rev;all.co+=a.co;all.pf+=a.pf;a.inv.forEach(x=>all.inv.add(x))});
  let tiles='';years.forEach(y=>{tiles+=tile(String(y),A.yr[String(y)],String(y))});
  return modes+'<div class="cal-title">كل السنوات</div><div class="cal-sum">'+ovSumTiles(all,Object.keys(A.day).length)+'</div>'+
    '<div class="cal-tiles">'+tiles+'</div><div class="cal-leg"><span>السطر الأول: المبيعات</span><span>السطر الثاني: الربح</span><span>اضغط سنة لعرض أشهرها</span></div>';
}
function ovDayHTML(ds){
  const hs=store.sales.filter(h=>h.date===ds).sort((a,b)=>(b.ts||0)-(a.ts||0));
  const its=store.sale_items_flat.filter(s=>s.date===ds);
  const rev=sum(its,saleItemNet),co=sum(its,s=>saleItemCoRev(s,s.distributor_id)),cg=sum(its,saleItemCost),pf=r2(co-cg);
  const byP={};
  its.forEach(it=>{const a=byP[it.product_id]||(byP[it.product_id]={q:0,rev:0,pf:0});a.q+=it.qty;a.rev+=saleItemNet(it);a.pf+=saleItemCoRev(it,it.distributor_id)-saleItemCost(it)});
  const head='<h3>📅 '+CAL_DOWFULL[parseD(ds).getDay()]+' · '+ds+'</h3>';
  if(!hs.length)return head+'<div class="empty">لا مبيعات في هذا اليوم</div><button class="btn-ghost btn-block" id="cal-close" type="button">إغلاق</button>';
  return head+'<div class="cal-sum">'+calTile('المبيعات',money(rev))+calTile('إيراد الشركة (جملة)',money(co))+
    calTile('صافي الربح','<span class="'+(pf>=0?'up':'dn')+'">'+money(pf)+'</span>')+calTile('معدل الربح',(co?pf/co*100:0).toFixed(1)+'%')+'</div>'+
    '<h4 style="margin:12px 0 6px">حسب المنتج</h4>'+
    Object.keys(byP).map(pid=>{const a=byP[pid];return '<div class="kv"><span>'+escHtml(pn(pid))+' <small>× '+fmt(a.q)+'</small></span><b>'+fmt(a.rev)+' · <span class="'+(a.pf>=0?'up':'dn')+'">ربح '+fmt(a.pf)+'</span></b></div>'}).join('')+
    '<h4 style="margin:12px 0 6px">الفواتير ('+hs.length+')</h4>'+
    hs.map(h=>{const p=r2(sum(h.items,x=>saleItemCoRev(x,h.distributor_id))-sum(h.items,saleItemCost));
      return '<div class="kv"><span>'+escHtml(dn(h.distributor_id))+' ← '+escHtml(cn(h.customer_id))+' '+tag(h.type==='cash'?'cash':h.type==='bank'?'rec':'credit',SALE_TYPE_AR[h.type]||h.type)+'</span><b>'+fmt(saleTotal(h))+' · <span class="'+(p>=0?'up':'dn')+'">'+fmt(p)+'</span></b></div>'}).join('')+
    '<button class="btn-ghost btn-block" id="cal-close" type="button" style="margin-top:12px">إغلاق</button>';
}

/* =====================================================================

function collectionsSplitHTML(){
  const t=today(),mk=t.slice(0,7);
  const calc=inR=>{
    const its=store.sale_items_flat.filter(s=>inR(s.date)),pays=store.payments.filter(p=>inR(p.date));
    return{
      cash:sum(its.filter(s=>s.type==='cash'),saleItemNet)+sum(pays.filter(p=>p.channel==='cash'),p=>p.amount),
      bank:sum(its.filter(s=>s.type==='bank'),saleItemNet)+sum(pays.filter(p=>p.channel!=='cash'),p=>p.amount)
    };
  };

function custInvoices(cid){
  return store.sales.filter(h=>h.customer_id===cid).sort((a,b)=>a.date.localeCompare(b.date)||(a.ts||0)-(b.ts||0));
}
function invoiceScope(cid,hid){
  const all=custInvoices(cid);
  return hid==='all'?all:all.filter(h=>h.id===hid);
}
function invoiceText(cid,hid){
  const c=store.customers.find(x=>x.id===cid);if(!c)return '';
  const list=invoiceScope(cid,hid),co=store.company.name;
  const L=[co,hid==='all'?'كشف حساب فواتير':'فاتورة','العميل: '+c.name,(c.phone?'الهاتف: '+c.phone:''),'تاريخ الإصدار: '+today(),''].filter((x,i)=>x!==''||i>4);
  list.forEach(h=>{
    L.push('— فاتورة بتاريخ '+h.date+' ('+(SALE_TYPE_AR[h.type]||h.type)+')');
    h.items.forEach(it=>L.push('• '+pn(it.product_id)+': '+fmt(it.qty)+' × '+fmt(it.price)+(it.discount?' − خصم '+fmt(it.discount):'')+' = '+fmt(saleItemNet(it))+' '+cur()));
    L.push('الإجمالي: '+fmt(saleTotal(h))+' '+cur());L.push('');
  });
  L.push('إجمالي الفواتير: '+fmt(sum(list,saleTotal))+' '+cur());
  const bal=custBal(store,c);
  if(hid==='all'){
    const pays=store.payments.filter(p=>p.customer_id===cid).sort((a,b)=>a.date.localeCompare(b.date));
    if(pays.length){L.push('');L.push('سندات القبض:');pays.forEach(p=>L.push('• '+p.date+' — '+fmt(p.amount)+' '+cur()+' ('+(CH_AR[p.channel]||p.channel)+')'))}
    L.push('');L.push('إجمالي المدفوع بسندات القبض: '+fmt(bal.paid)+' '+cur());
    if(bal.discounts>0)L.push('خصومات: '+fmt(bal.discounts)+' '+cur());
    if(bal.tax>0)L.push('ضريبة تأخير: '+fmt(bal.tax)+' '+cur());
    L.push('المتبقي على العميل: '+fmt(bal.remainingWithTax)+' '+cur());
  }else if(list[0]&&list[0].type==='credit'){
    L.push('الرصيد المتبقي على العميل (كل الفواتير الآجلة): '+fmt(bal.remaining)+' '+cur());
  }
  L.push('');L.push('شاكرين تعاملكم — '+co);
  return L.join('\n');
}

function printHTMLDoc(html){
  const w=window.open('','_blank');
  if(w){
    w.document.open();w.document.write(html);w.document.close();
    setTimeout(()=>{try{w.focus();w.print()}catch(x){}},500);
    return;
  }
  const f=document.createElement('iframe');
  f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';
  document.body.appendChild(f);
  const d=f.contentWindow.document;d.open();d.write(html);d.close();
  setTimeout(()=>{try{f.contentWindow.focus();f.contentWindow.print()}catch(x){toast('تعذر فتح نافذة الطباعة','err')}setTimeout(()=>f.remove(),4000)},500);
}

let prodLB;
function mountProduction(){

      title: 'مسح منتج للوردية', mode: 'product', screen: 'production',

        const container = byId('prod-lines');
        if(!container) return;

        if(addBtn) addBtn.click();
        setTimeout(() => {
          const rows = container.querySelectorAll('.lineitem');
          const lastRow = rows[rows.length - 1];
          if(!lastRow) return;
          const prodSel = lastRow.querySelector('[data-f="product_id"]');
          const plannedIn = lastRow.querySelector('[data-f="planned"]');
          if(prodSel) prodSel.value = product.id;
          if(plannedIn){ plannedIn.value = 0; plannedIn.focus(); }
          toast('✅ أُضيف: ' + product.name,'ok');
        }, 150);
      },

    });
  };

  if(prodLines && prodLines.parentNode){
    prodLines.parentNode.insertBefore(prodScanBtn, prodLines);
  }
  mountForm(byId('prod-head'),'ph',[
    {k:'date',label:'تاريخ الإنتاج',type:'date',value:today},
    {k:'operator_id',label:'المشغّل',type:'select',options:opt.operators},
    {k:'shift',label:'الوردية',type:'select',options:[['Morning','صباحي'],['Evening','مسائي'],['Night','ليلي']]}
  ],{noSubmit:true,main:true});
  prodLB=lineBuilder(byId('prod-lines'),'production');
  byId('prod-save').onclick=async()=>{
    if(!requirePerm('production'))return;
    if(!attendanceToday()){toast('أكّد الحضور أولاً','err');return}
    const attRec = attendanceToday();
    const presentSet = new Set(attRec.present||[]);
    const photosSet = new Set(Object.keys(attRec.photos||{}));
    for(const pid of presentSet){
      if(!photosSet.has(pid)){toast('صورة المشغّل '+nm('operators',pid)+' مفقودة','err');return;}
    }
    const hf=forms.find(f=>f.id==='ph'),v=hf.vals(),lines=prodLB.values().filter(l=>l.product_id&&l.planned>0);
    if(!v.operator_id||!v.shift){toast('أكمل البيانات','err');return}
    if(!lines.length){toast('أضف صنفاً','err');return}
    for(const l of lines)if(l.down>0&&!l.reason){toast('أدخل سبب التوقف','err');return}
    const header={id:uuid(),date:v.date||today(),shift:v.shift,operator_id:v.operator_id,notes:byId('prod-notes').value.trim(),by:user.name,ts:Date.now()};
    const items=lines.map(l=>({id:uuid(),product_id:l.product_id,planned:l.planned,actual:l.actual,waste:l.waste,down:l.down,reason:l.reason}));
        const ok=await tryCommit(
      draft=>{draft.shifts.unshift(Object.assign({},header,{items}))},
      async()=>{await adapter.saveTicket('shifts','shift_items','shift_id',header,items)},
      {rerender:['production','overview','withdrawals']}
    );
    if(ok){
      toast('تم','ok');
      
      // 🎁 حساب المكافآت
      try{
        const awards = calculateProductionBonuses(header, items);
        if(awards.length){
          const draft2 = clone(store);
          draft2.bonus_awards = draft2.bonus_awards || [];
          
          for(const award of awards){
            draft2.bonus_awards.unshift(award);
            try{
              await adapter.saveSimple('bonus_awards', award);
            }catch(e){ console.warn('save award failed:', e); }
          }
          
          draft2.audit.unshift({
            id: uuid(),
            ts: Date.now(),
            by: user.name,
            act: 'بونص',
            text: 'تحقيق ' + awards.length + ' مكافأة إنتاج بقيمة ' + 
              fmt(sum(awards, a => a.reward_amount)) + ' ' + cur()
          });
          
          store = draft2;
          
                // إشعارات: المشغّل + المدراء
          for(const award of awards){
            if(award.target_id){
              const op = store.operators.find(o => o.id === award.target_id);
              if(op && op.user_id){
                NotificationCenter.fire('bonus_achieved', {
                  targetUserId: op.user_id,
                  targetName: op.name,
                  ruleName: award.rule_name,
                  amount: fmt(award.reward_amount) + ' ' + cur(),
                  url: '/#op_ops'
                }).catch(e => console.warn(e));
              }
            }
          }
          
          toast('🎁 ' + awards.length + ' مكافأة جديدة!', 'ok');
          renderAll();
        }
      }catch(ex){
        console.error('[Bonuses] فشل:', ex);
      }
      
      hf.reset();
      prodLB.reset();
      byId('prod-notes').value='';
    }
  };
}

async function distShiftCheckIn(distId, photoData, coords, shiftType){
  if(!requirePerm('distributors') && !requirePerm('sales')) return;
  const d = store.distributors.find(x => x.id === distId);
  if(!d) return;
  const now = Date.now();
  const row = {
    id: uuid(), date: today(), distributor_id: distId,
    shift: shiftType || getCurrentShift(),
    checkin_ts: now, checkin_photo: photoData || null,
    checkin_lat: coords ? coords.lat : null, checkin_lng: coords ? coords.lng : null,
    checkout_ts: null, checkout_photo: null, checkout_lat: null, checkout_lng: null,
    closed: false, note: '', by: user.name, ts: now
  };
  try{
    await adapter.saveSimple('distributor_shifts', row);
    if(!store.distributor_shifts) store.distributor_shifts = [];
    store.distributor_shifts.unshift(row);
    toast('✅ تم بدء وردية ' + d.name,'ok');
    closeSheet();
    NotificationCenter.fire('dist_shift_start', {
      distName: d.name, distUserId: d.user_id,
      shiftAr: (SHIFT_TYPES[row.shift] || {}).ar || row.shift, refId: row.id
    }).catch(e => console.warn(e));
    if(isEarlyShiftStart(now)){
      const th = (store.company && store.company.shift_early_threshold) || 5;
      NotificationCenter.fire('early_shift_start', { userName: d.name, threshold: th, refId: row.id }).catch(e => console.warn(e));
      sendPushToAdmins('⏰ بدء وردية مبكر', d.name + ' بدأ ورديته قبل الساعة ' + th + ' صباحاً', '/#attendance_log', 'early_shift_start', row.id).catch(e=>console.warn(e));
    }
    if(isLateShiftStart(now)){
      const th = (store.company && store.company.shift_late_threshold) || 10;
      NotificationCenter.fire('late_shift_start', { userName: d.name, threshold: th, refId: row.id }).catch(e => console.warn(e));
      sendPushToAdmins('⚠️ تأخير في بدء الوردية', d.name + ' بدأ ورديته بعد الساعة ' + th + ' صباحاً', '/#attendance_log', 'late_shift_start', row.id).catch(e=>console.warn(e));
    }
    renderAll();
  }catch(ex){
    console.error(ex);
    toast('تعذر: ' + ex.message, 'err');
  }
}

async function distShiftCheckOut(distId, photoData, coords, note){
  const s = getTodayShift(distId, 'distributor');
  if(!s) return toast('لا وردية مفتوحة', 'err');
  const d = store.distributors.find(x => x.id === distId);
  const now = Date.now();
  const patch = {
    checkout_ts: now, checkout_photo: photoData || null,
    checkout_lat: coords ? coords.lat : null, checkout_lng: coords ? coords.lng : null,
    note: note || '', closed: true
  };
  try{
    await adapter.updateSimple('distributor_shifts', s.id, patch);
    Object.assign(s, patch);
    const minutes = calcShiftDurationMinutes(s.checkin_ts, s.checkout_ts);
    const hours = r2(minutes / 60);
    toast('✅ تم إغلاق وردية ' + (d ? d.name : '') + ' — ' + hours + ' ساعة','ok');

      distName: d ? d.name : '', distUserId: d ? d.user_id : null,
      duration: hours + ' ساعة', refId: s.id
    }).catch(e => console.warn(e));
    renderAll();
  }catch(ex){
    console.error(ex);
    toast('تعذر: ' + ex.message, 'err');
  }
}

function mountOpOps(){

  if(!picker) return;
  
  // ✅ إذا كان المستخدم مشغّلاً — اقفل على نفسه
  const myOperator = (store.operators||[]).find(o => o.user_id === user.id);
  
  const ops = store.operators;
  picker.innerHTML = ops.map(o => 
    '<option value="' + o.id + '">' + escHtml(o.name) + '</option>'
  ).join('');
  
  if(myOperator && !isA()){
    // ✅ المشغّل يرى نفسه فقط — أخفِ القائمة
    picker.value = myOperator.id;
    if(wrap) wrap.style.display = 'none';
  }
  
  picker.onchange = () => renderOpOps();

}

function renderOpOps(){
  const content = byId('oops-content');
  if(!content) return;
  
  const picker = byId('oops-picker');
  const oid = picker ? picker.value : null;
  if(!oid){
    content.innerHTML = '<div class="empty">اختر مشغّلاً</div>';
    return;
  }
  
  const o = store.operators.find(x => x.id === oid);
  if(!o){
    content.innerHTML = '<div class="empty">المشغّل غير موجود</div>';
    return;
  }
  
  // =========================================================
  // جمع البيانات
  // =========================================================
  
  // 1. الإنتاج
  const myItems = (store.shift_items_flat || []).filter(s => s.operator_id === oid);
  const totalProduced = sum(myItems, s => s.actual);
  const totalWaste = sum(myItems, s => s.waste);
  const totalDown = sum(myItems, s => s.down);
  
  // تفصيل حسب المنتج
  const byProduct = {};
  myItems.forEach(it => {
    const pid = it.product_id;
    if(!byProduct[pid]) {
      byProduct[pid] = {
        p: pOf(store, pid),
        planned: 0, actual: 0, waste: 0, down: 0,
        days: new Set(),
        incentive: 0
      };
    }
    byProduct[pid].planned += (it.planned || 0);
    byProduct[pid].actual += (it.actual || 0);
    byProduct[pid].waste += (it.waste || 0);
    byProduct[pid].down += (it.down || 0);
    byProduct[pid].days.add(it.date);
    const prod = pOf(store, pid);
    if(prod) {
      byProduct[pid].incentive += (it.actual || 0) * (prod.incentive || 0);
    }
  });
  const productList = Object.values(byProduct)
    .map(x => Object.assign({}, x, { daysCount: x.days.size }))
    .filter(x => x.p)
    .sort((a, b) => b.actual - a.actual);
  
  // ✅ الأكثر إنتاجاً
  const topProducts = productList.slice(0, 5);
  
  // ✅ التوقفات
  const stops = myItems.filter(it => it.down > 0 && it.reason)
    .map(it => ({
      date: it.date,
      product: pOf(store, it.product_id),
      down: it.down,
      reason: it.reason,
      shift: it.shift
    }))
    .sort((a, b) => b.date.localeCompare(a.date));
  
  const stopsByReason = {};
  stops.forEach(s => {
    if(!stopsByReason[s.reason]) stopsByReason[s.reason] = { count: 0, totalMin: 0 };
    stopsByReason[s.reason].count++;
    stopsByReason[s.reason].totalMin += s.down;
  });
  
  // 2. المستحقات
  const due = operatorDue(store, oid);
  const earned = operatorEarned(store, oid);
  const payments = (store.operator_payments || [])
    .filter(p => p.operator_id === oid)
    .sort((a, b) => (b.ts || 0) - (a.ts || 0));
  const totalPaid = sum(payments, p => p.amount);
  
  // 3. الخصومات
  const discounts = (store.discounts || [])
    .filter(x => x.kind === 'operator' && x.ref_id === oid && !x.cancelled)
    .sort((a, b) => (b.ts || 0) - (a.ts || 0));
  const totalDiscounts = sum(discounts, d => d.amount);
  
  // 4. الورديات
  const shifts = (store.operator_shifts || [])
    .filter(s => s.operator_id === oid)
    .sort((a, b) => b.date.localeCompare(a.date) || (b.checkin_ts || 0) - (a.checkin_ts || 0));
  const shiftStats = getShiftStats(oid, 'operator');
  
  // =========================================================
  // بناء الواجهة
  // =========================================================
  
  let html = '';
  
  // ✅ رأس الصفحة
  html += '<div class="kgrid">' +
    '<div class="kpi wide"><div class="lb">💰 المستحق له</div>' +
      '<div class="val ' + (due > 0.009 ? 'dn' : 'up') + '">' +
      fmt(Math.max(due, 0)) + ' ' + cur() + '</div>' +
      '<div class="sub mut">إجمالي حوافزه: ' + fmt(earned) + ' ' + cur() + '</div>' +

    '<div class="kpi"><div class="lb">⏰ ساعات العمل</div>' +

  '</div>';
  
  // ✅ الشرائح
  html += '<div class="pills" id="oops-tabs" style="margin:16px 0 12px">' +
    '<button class="pill on" data-oopstab="overview">📊 نظرة عامة</button>' +
    '<button class="pill" data-oopstab="earnings">💰 المستحقات</button>' +
    '<button class="pill" data-oopstab="production">📦 الإنتاج</button>' +

  // ✅ احفظ البيانات
  const data = {

    productList, topProducts, stops, stopsByReason,
    due, earned, payments, totalPaid,
    discounts, totalDiscounts,
    shifts, shiftStats

  const tabsEl = byId('oops-tabs');
  if(tabsEl){
    tabsEl._oopsData = data;
  }
  
  renderOpOpsTab('overview', data);
}

function renderWarehouse(){
  const content = byId('wh-content');
  if(!content) return;
  
  // =========================================================
  // جمع كل البيانات
  // =========================================================
  
  // 1. مخزون المنتجات
  const productsStock = store.products.map(p => ({
    p,
    stock: stockWH(store, p.id),
    dist_price: p.dist_price || p.price || 0,
    isLow: p.min_stock && stockWH(store, p.id) < p.min_stock
  }));
  const totalProductStock = sum(productsStock, x => x.stock);
  const totalProductValue = sum(productsStock, x => x.stock * x.p.cost);
  const lowProducts = productsStock.filter(x => x.isLow);
  
  // 2. مخزون المواد الخام
  const materialsStock = store.materials.map(m => ({
    m,
    stock: materialStock(store, m.id),
    isLow: m.min_stock && materialStock(store, m.id) < m.min_stock
  }));
  const totalMaterialStock = sum(materialsStock, x => x.stock);
  const totalMaterialValue = sum(materialsStock, x => x.stock * x.m.cost);
  const lowMaterials = materialsStock.filter(x => x.isLow);
  
  // 3. عهدة الموزعين
  const custodyList = [];
  store.distributors.forEach(d => {
    store.products.forEach(p => {
      const q = custody(store, d.id, p.id);
      if(q > 0){
        custodyList.push({
          d, p, q,
          value: r2(q * (p.dist_price || p.price || 0))
        });
      }
    });
  });
  const totalCustodyValue = sum(custodyList, x => x.value);
  const totalCustodyQty = sum(custodyList, x => x.q);
  
  // 4. المسحوبات الحديثة
  const recentWithdrawals = (store.withdrawals || [])
    .sort(byDate)
    .slice(0, 30);
  const todayWdCount = store.withdrawals.filter(w => w.date === today()).length;
  
  // 5. آخر الإنتاج
  const recentShifts = (store.shifts || [])
    .sort(byDate)
    .slice(0, 20);
  
  // 6. آخر المشتريات
  const recentPurchases = (store.purchases || [])
    .sort(byDate)
    .slice(0, 20);
  
  // 7. البيانات للواجهة
  const data = {
    productsStock, totalProductStock, totalProductValue, lowProducts,
    materialsStock, totalMaterialStock, totalMaterialValue, lowMaterials,
    custodyList, totalCustodyValue, totalCustodyQty,
    recentWithdrawals, todayWdCount,
    recentShifts,
    recentPurchases
  };
  
  // =========================================================
  // بناء الواجهة
  // =========================================================
  
  let html = '';
  
  // ✅ الإحصائيات السريعة
  html += '<div class="kgrid">';
  
  // 💰 القيمة الإجمالية — للمدير فقط
  if(canViewCost()){
    html += '<div class="kpi wide"><div class="lb">💰 قيمة المخزون الإجمالية</div>' +
      '<div class="val">' + fmt(totalProductValue + totalMaterialValue + totalCustodyValue) + ' ' + cur() + '</div>' +
      '<div class="sub mut">منتجات + مواد + عهد</div>' +
    '</div>';
  }
  
  html += '<div class="kpi"><div class="lb">📦 وحدات المنتجات</div>' +
    '<div class="val">' + fmt(totalProductStock) + '</div>' +
    '<div class="sub ' + (lowProducts.length ? 'dn' : 'up') + '">' + 
    lowProducts.length + ' تحت الحد</div></div>' +
    '<div class="kpi"><div class="lb">🌾 مواد خام</div>' +
      '<div class="val">' + fmt(totalMaterialStock) + '</div>' +
      '<div class="sub ' + (lowMaterials.length ? 'dn' : 'up') + '">' + 
      lowMaterials.length + ' تحت الحد</div></div>' +
    '<div class="kpi"><div class="lb">👥 عهدة الموزعين</div>' +
      '<div class="val">' + fmt(totalCustodyQty) + '</div>' +
      '<div class="sub mut">وحدة</div></div>' +
    '<div class="kpi"><div class="lb">📤 مسحوبات اليوم</div>' +
      '<div class="val">' + todayWdCount + '</div>' +
      '<div class="sub mut">عملية</div></div>' +
  '</div>';
  
  // ✅ أزرار سريعة
  html += '<div class="btnrow" style="margin-bottom:12px">' +
    '<button class="btn-primary" id="wh-scan-btn" style="display:flex;align-items:center;justify-content:center;gap:6px">' +
      '<span style="font-size:18px">📷</span> مسح منتج' +

      '<span style="font-size:18px">➕</span> إضافة منتج' +
    '</button>' +
  '</div>';
  
  // ✅ الشرائح
  html += '<div class="pills" id="wh-tabs" style="margin:16px 0 12px">' +
    '<button class="pill on" data-whtab="overview">📊 نظرة عامة</button>' +
    '<button class="pill" data-whtab="products">📦 المنتجات</button>' +
    '<button class="pill" data-whtab="materials">🌾 المواد الخام</button>' +
    '<button class="pill" data-whtab="custody">👥 عهدة الموزعين</button>' +
    '<button class="pill" data-whtab="withdrawals">📤 المسحوبات</button>' +
    '<button class="pill" data-whtab="production">🏭 الإنتاج</button>' +
    '<button class="pill" data-whtab="purchases">🛍️ المشتريات</button>' +
    (lowProducts.length + lowMaterials.length > 0

      : '<button class="pill" data-whtab="alerts">⚠️ التنبيهات</button>'

  html += '<div id="wh-body"></div>';

  // ✅ احفظ البيانات

  if(tabsEl){

  if(scanBtn) scanBtn.onclick = () => openScannerForStock();

 /* =====================================================================
   🆕 مسح الباركود لفحص المخزون
   ===================================================================== */
function openScannerForStock(){
  if(!window.openScanner){
    toast('وحدة المسح غير محمّلة','err');
    return;
  }
  
  window.openScanner({
    title: 'مسح منتج لفحص المخزون',
    mode: 'product',
    screen: 'warehouse',
    onFound: (product, code) => {
      // ✅ ابحث عن المنتج في المخزون
      const stock = stockWH(store, product.id);
      const isLow = product.min_stock && stock < product.min_stock;
      
      // ✅ جهّز بيانات العرض
      const distPrice = product.dist_price || product.price || 0;
      const stockValue = r2(stock * (product.cost || 0));
      
      // ✅ المادة الخام المرتبطة
      let materialInfo = '';
      if(product.material_id){
        const mat = store.materials.find(m => m.id === product.material_id);
        if(mat){
          const matStock = materialStock(store, mat.id);
          const needed = r2(stock * (product.material_qty || 0));
          materialInfo = 
            '<div style="background:rgba(108,184,255,.1);border:1px solid var(--blue);border-radius:8px;padding:10px;margin-top:10px">' +
              '<h3 style="font-size:13px;margin-bottom:6px">🌾 المادة الخام المرتبطة</h3>' +
              '<div class="kv"><span>' + escHtml(mat.name) + '</span><b>' + fmt(matStock) + ' ' + escHtml(mat.unit || '') + '</b></div>' +
              '<div class="kv"><span>تحتاج لتصنيع المخزون</span><b>' + fmt(needed) + '</b></div>' +
              '<div class="kv"><span>يكفي لتصنيع</span><b class="' + (matStock > 0 ? 'up' : 'dn') + '">' + 
                (product.material_qty > 0 ? fmt(Math.floor(matStock / product.material_qty)) : '—') + ' وحدة</b></div>' +
            '</div>';
       }
      }
      
      // ✅ سجل عمليات المسح
      const log = {
        id: uuid(),
        ts: Date.now(),
        barcode: code || product.barcode || '—',
        found: true,
        product_id: product.id,
        user_name: user.name,
        screen: 'warehouse',
        action: 'stock_check'
      };
      adapter.saveSimple('scan_log', log).catch(e => console.warn('log failed', e));
      
      // ✅ فتح نافذة التفاصيل
      openSheet(
        '<h3>📦 ' + escHtml(product.name) + '</h3>' +
        
        '<div class="card" style="margin-bottom:12px;' + 
          (isLow ? 'border-color:var(--red);background:rgba(255,111,97,.1)' : 'border-color:var(--green);background:rgba(61,220,132,.08)') + '">' +
          '<div class="kv"><span>📦 المتاح في المخزون</span>' +
            '<b style="font-size:24px" class="' + (isLow ? 'dn' : 'up') + '">' + 
            fmt(stock) + ' <small>' + escHtml(product.unit || '') + '</small></b></div>' +
          (isLow ? 
            '<div class="kv"><span>⚠️ تحت الحد الأدنى</span>' +
              '<b class="dn">' + fmt(product.min_stock - stock) + ' ناقص</b></div>' 
            : '<div class="kv"><span>✅ فوق الحد الأدنى</span><b class="up">(الحد: ' + fmt(product.min_stock) + ')</b></div>'
          ) +
        '</div>' +
        
                // تفاصيل المنتج
        '<div class="card" style="margin-bottom:12px">' +
          (canViewCost() ? '<div class="kv"><span>💰 تكلفة التصنيع</span><b>' + fmt(product.cost || 0) + ' ' + cur() + '</b></div>' : '') +
          '<div class="kv"><span>🏷️ سعر التجزئة</span><b>' + fmt(product.price || 0) + ' ' + cur() + '</b></div>' +
          '<div class="kv"><span>🚚 سعر الجملة</span><b>' + fmt(distPrice) + ' ' + cur() + '</b></div>' +
          (canViewCost() ? '<div class="kv"><span>💎 قيمة المخزون</span><b>' + fmt(stockValue) + ' ' + cur() + '</b></div>' : '') +
          '<div class="kv"><span>📅 الباركود</span><b><bdi>' + escHtml(product.barcode || '—') + '</bdi></b></div>' +
        '</div>' +
        
        materialInfo +
        
              // أزرار الإجراءات

          (canEditProduct() ? '<button class="btn-ghost" id="wh-edit-product">✏️ تعديل المنتج</button>' : '') +

   🆕 إضافة منتج سريع (لأمين المستودع)
   ===================================================================== */
function openAddProductSheet(){
  // ✅ التحقق من الصلاحية
  if(!requirePerm('production','لإضافة منتج') && 
     !requirePerm('purchases','لإضافة منتج') &&
     !requirePerm('withdrawals','لإضافة منتج') &&
     !isA()){
    toast('ليس لديك صلاحية لإضافة منتج','err');
    return;
  }
  
  openSheet(
    '<h3>➕ إضافة منتج جديد</h3>' +
    '<div class="step-hint">' +
      '📦 املأ بيانات المنتج. الحقول ذات <b style="color:var(--red)">*</b> مطلوبة.' +
    '</div>' +
    '<div id="wh-newproduct-form"></div>'
  );
  
  mountForm(byId('wh-newproduct-form'),'newp',[
    {k:'name',label:'اسم المنتج *',type:'text',placeholder:'مثال: خبز عربي 500غ'},
    {k:'barcode',label:'الباركود',type:'text',withScan:'product',hint:'امسح الباركود أو اكتبه'},
    {k:'unit',label:'الوحدة *',type:'text',value:'حبة',placeholder:'كيس / علبة / عبوة'},
    {k:'cost',label:'تكلفة التصنيع *',type:'number',step:'0.001',value:0},
    {k:'price',label:'سعر التجزئة *',type:'number',step:'0.001',value:0},
    {k:'dist_price',label:'سعر الجملة',type:'number',step:'0.001',value:0},
    {k:'opening',label:'مخزون افتتاحي',type:'number',value:0},
    {k:'min_stock',label:'حد التنبيه',type:'number',value:0},
    {k:'material_id',label:'المادة الخام',type:'select',nophd:true,options:()=>[['','بدون']].concat(opt.materials())},
    {k:'material_qty',label:'كمية المادة/وحدة',type:'number',step:'0.001',value:0},
    {k:'incentive',label:'حافز الإنتاج/وحدة',type:'number',step:'0.001',value:0}
  ],{
    label:'💾 حفظ المنتج',
    submit:async v=>{
      // ✅ التحقق
      if(!v.name || v.name.length < 2){
        toast('أدخل اسم المنتج (حرفان على الأقل)','err');
        return false;
      }
      if(!v.unit){
        toast('أدخل الوحدة','err');
        return false;
      }
      if(v.price <= 0){
        toast('أدخل سعر التجزئة','err');
        return false;
      }
      
      // ✅ تحقق من عدم تكرار الباركود
      if(v.barcode){
        const exists = store.products.find(p => p.barcode === v.barcode);
        if(exists){
          toast('الباركود مستخدم في: ' + exists.name,'err');
          return false;
        }
      }
      
      // ✅ جهّز البيانات
      const row = {
        name: v.name.trim(),
        barcode: v.barcode || null,
        unit: v.unit.trim(),
        cost: Number(v.cost) || 0,
        price: Number(v.price) || 0,
        dist_price: Number(v.dist_price) || Number(v.price) || 0,
        opening: Number(v.opening) || 0,
        min_stock: Number(v.min_stock) || 0,
        material_id: v.material_id || null,
        material_qty: Number(v.material_qty) || 0,
        incentive: Number(v.incentive) || 0
      };
      
      try{
        const newId = await adapter.saveEntity('products', row);
        
        // ✅ حدّث store
        const draft = clone(store);
        draft.products.push(Object.assign({id: newId}, row));
        draft.audit.unshift({
          id: uuid(),
          ts: Date.now(),
          by: user.name,
          act: 'إضافة',
          text: 'منتج: ' + v.name
        });
        
        store = draft;
        index(store);
        
        toast('✅ تم إضافة المنتج: ' + v.name,'ok');
        closeSheet();
        
        // ✅ إعادة عرض المخزون
        renderAll();
        renderWarehouse();
        
        // ✅ سجل العملية
        try{
          const log = {
            id: uuid(),
            ts: Date.now(),
            barcode: v.barcode || '—',
            found: true,
            product_id: newId,
            user_name: user.name,
            screen: 'warehouse',
            action: 'add_product'
          };
          adapter.saveSimple('scan_log', log).catch(() => {});
        }catch(e){}
        
        // ✅ إشعار للمدير
        if(!isA()){
          NotificationCenter.fire('product_added', {
            productName: v.name,
            addedBy: user.name,
            refId: newId
          }).catch(e => console.warn(e));
        }
        
      }catch(ex){
        console.error(ex);
        toast('تعذر الحفظ: ' + ex.message,'err');
      }
      return false;
    }
  });
}

function mountDistOps(){
  const picker = byId('dops-picker');
  if(!picker) return;
  
  // إذا كان المستخدم موزعاً — اقفل على نفسه
  const myDist = user.distributor_id || 
    (store.distributors.find(d => d.user_id === user.id) || {}).id;
  
  const ds = store.distributors;
  picker.innerHTML = ds.map(d => 
    '<option value="' + d.id + '">' + escHtml(d.name) + '</option>'
  ).join('');
  
  // إذا كان موزعاً — اقفل الاختيار
  if(myDist && !isA()){
    picker.value = myDist;
    picker.disabled = true;
  }
  
  picker.onchange = () => renderDistOps();
  renderDistOps();
}

function renderDistOps(){
  const content = byId('dops-content');
  if(!content) return;
  
  const picker = byId('dops-picker');
  const did = picker ? picker.value : null;
  if(!did){
    content.innerHTML = '<div class="empty">اختر موزعاً</div>';
    return;
  }
  
  const d = store.distributors.find(x => x.id === did);
  if(!d){
    content.innerHTML = '<div class="empty">الموزع غير موجود</div>';
    return;
  }
  
  // جمع كل البيانات
  const summary = dSummary(store, d);
  const discounts = (store.discounts || [])
    .filter(x => x.kind === 'distributor' && x.ref_id === did && !x.cancelled)
    .sort((a, b) => (b.ts || 0) - (a.ts || 0));
  const totalDiscounts = sum(discounts, x => x.amount);
  const profit = distributorProfit(store, did);
  const shifts = (store.distributor_shifts || [])
    .filter(s => s.distributor_id === did)
    .sort((a, b) => b.date.localeCompare(a.date) || (b.checkin_ts || 0) - (a.checkin_ts || 0));
  const shiftStats = getShiftStats(did, 'distributor');
  const withdrawals = (store.withdrawals || [])
    .filter(w => w.distributor_id === did)
    .sort(byDate);
  const wdTotalQty = sum(withdrawals, w => w.qty);
  const wdTotalValue = sum(withdrawals, w => r2(w.qty * (w.price || 0)));
  const sales = (store.sales || [])
    .filter(s => s.distributor_id === did)
    .sort(byDate);
  const salesTotal = sum(sales, saleTotal);
  const remittances = (store.remittances || [])
    .filter(r => r.distributor_id === did)
    .sort(byDate);
  const remitTotal = sum(remittances, r => r.amount);
  const customers = store.customers.filter(c => c.distributor_id === did);
    // 🆕 سجلات التشيك
  const confirmations = (store.withdrawal_confirmations || [])
    .filter(c => c.distributor_id === did)
    .sort((a, b) => (b.ts || 0) - (a.ts || 0));
  const pendingConfirmations = confirmations.filter(c => c.status === 'pending');
  const confirmedConfirmations = confirmations.filter(c => c.status === 'confirmed');
  const disputedConfirmations = confirmations.filter(c => c.status === 'disputed');
  const customerBals = customers.map(c => ({c, b: custBal(store, c)}));
  const overdueCustomers = customerBals.filter(x => x.b.bucket === 'overdue');
  const totalOverdue = sum(overdueCustomers, x => x.b.remaining);
  
  // رأس الصفحة
  let html = '<div class="kgrid">' +
    '<div class="kpi wide"><div class="lb">💰 المطلوب منه الشركة</div>' +
      '<div class="val ' + (summary.bal > 0.009 ? 'dn' : 'up') + '">' +
      fmt(Math.abs(summary.bal)) + ' ' + cur() + '</div>' +
      '<div class="sub mut">' + summary.per.label + ' · التسليم ' + summary.per.e + '</div>' +
    '</div>' +
    '<div class="kpi"><div class="lb">إجمالي المبيعات</div>' +
      '<div class="val">' + fmt(profit.revenue) + '</div></div>' +
    '<div class="kpi"><div class="lb">إجمالي ربحه</div>' +
      '<div class="val up">' + fmt(profit.profit) + '</div></div>' +
  '</div>';
  
  // الشرائح
    html += '<div class="pills" id="dops-tabs" style="margin:16px 0 12px">' +
    '<button class="pill on" data-dopstab="overview">📊 نظرة عامة</button>' +
    (pendingConfirmations.length > 0 
      ? '<button class="pill" data-dopstab="confirmations" style="background:var(--orange);color:#fff">🔔 تشيكاتي (' + pendingConfirmations.length + ')</button>'
      : '<button class="pill" data-dopstab="confirmations">📋 سجل التشيكات</button>'
    ) +
    '<button class="pill" data-dopstab="debts">💳 المطلوب منه</button>' +
    '<button class="pill" data-dopstab="discounts">💸 الخصومات</button>' +
    '<button class="pill" data-dopstab="profit">💰 الأرباح</button>' +
    '<button class="pill" data-dopstab="shifts">⏰ ساعات العمل</button>' +
    '<button class="pill" data-dopstab="withdrawals">📦 المسحوبات</button>' +
    '<button class="pill" data-dopstab="sales">🛒 المبيعات</button>' +
    '<button class="pill" data-dopstab="remittances">💵 التحصيلات</button>' +
    '<button class="pill" data-dopstab="customers">👥 العملاء</button>' +
    '<button class="pill" data-dopstab="bonuses">🎁 البونص</button>' +
    '<button class="pill" data-dopstab="bonus_progress">📊 تقدم المكافآت</button>' +
  '</div>';
  
  html += '<div id="dops-body"></div>';
  content.innerHTML = html;
  
    const data = { d, summary, discounts, totalDiscounts, profit, shifts, shiftStats,
    withdrawals, wdTotalQty, wdTotalValue, sales, salesTotal,
    remittances, remitTotal, customers, customerBals, overdueCustomers, totalOverdue,
    confirmations, pendingConfirmations, confirmedConfirmations, disputedConfirmations };
  
 // ربط الشرائح — طريقة أفضل
const tabsEl = byId('dops-tabs');
if(tabsEl){

async function confirmWithdrawal(confirmationId, action){
  const c = store.withdrawal_confirmations.find(x => x.id === confirmationId);
  if(!c) return toast('السجل غير موجود','err');
  
  // action: 'confirmed' أو 'disputed'
  const isDispute = action === 'disputed';
  
  const btn = byId(isDispute ? 'confirm_dispute' : 'confirm_submit');
  if(btn) btn.disabled = true;
  
  const notes = (byId('confirm_notes') || {}).value || '';
  
  // ✅ تأكيد على نافذة إذا كان اعتراضاً
  if(isDispute){
    const confirmed = window.confirm(
      '⚠️ أنت على وشك رفض البضاعة.\n\n' +
      'سيتم:\n' +
      '• إرجاع البضاعة للمخزون\n' +
      '• إلغاء السحب\n' +
      '• إشعار المدير والمشغّل\n\n' +
      'هل أنت متأكد؟'
    );
    if(!confirmed){
      if(btn) btn.disabled = false;
      return;
    }
  }
  
  // ✅ تحقق: هل يوجد سبب في حالة الاعتراض؟
  if(isDispute && !notes.trim()){
    toast('يرجى كتابة سبب الاعتراض في الملاحظات','err');
    if(btn) btn.disabled = false;
    return;
  }
  
  // البيانات
  const patch = {
    status: action,
    confirmed_at: Date.now(),
    confirmed_by: user.name,
    notes: notes || (isDispute ? 'اعتراض من الموزع' : 'تم الاستلام')
  };
  
  try{
    // ✅ إذا كان اعتراضاً — أعد البضاعة للمخزون
    if(isDispute){
      // 1. احذف السحب من قاعدة البيانات
      const wdIds = Array.from(new Set([c.withdrawal_id].concat((c.items || []).map(i => i.withdrawal_id)).filter(Boolean)));
      for(const wid of wdIds){ await adapter.deleteSimple('withdrawals', wid); }
      
      // 2. حدّث سجل التشيك
      await adapter.updateSimple('withdrawal_confirmations', confirmationId, patch);
      
      // 3. حدّث المخزون محلياً
      const draft = clone(store);
      draft.withdrawals = draft.withdrawals.filter(w => wdIds.indexOf(w.id) < 0);
      const cc = draft.withdrawal_confirmations.find(x => x.id === confirmationId);
      if(cc) Object.assign(cc, patch);
      
      // 4. سجّل في audit
      draft.audit.unshift({
        id: uuid(),
        ts: Date.now(),
        by: user.name,
        act: 'اعتراض',
        text: 'إرجاع بضاعة للمخزون — ' + 
          (c.items || []).map(i => i.product_name + ' × ' + fmt(i.qty_expected)).join('، ')
      });
      
      store = draft;
    } else {
      // ✅ تأكيد عادي — لا تغيير في المخزون
      await adapter.updateSimple('withdrawal_confirmations', confirmationId, patch);
      Object.assign(c, patch);
    }
    
    const d = store.distributors.find(x => x.id === c.distributor_id);
    const itemsCount = (c.items || []).length;
    
    toast(
      isDispute ? '⚠️ تم رفض الاستلام — أُرجعت البضاعة للمخزون' : '✅ تم تأكيد الاستلام',
      isDispute ? 'err' : 'ok'
    );
    closeSheet();
    
    // 🆕 الإشعارات
    if(isDispute){
      NotificationCenter.fire('withdrawal_disputed', {
        distName: d ? d.name : 'موزع',
        reason: notes || 'اعتراض على الاستلام',
        refId: c.id
      }).catch(e => console.warn(e));
    } else {
      NotificationCenter.fire('withdrawal_confirmed', {
        distName: d ? d.name : 'موزع',
        itemsCount: itemsCount,
        refId: c.id
      }).catch(e => console.warn(e));
    }
    
    renderAll();
    
  }catch(ex){
    console.error(ex);
    toast('تعذر الحفظ: ' + ex.message, 'err');
    if(btn) btn.disabled = false;
  }
}

async function requestRecheck(confirmationId){
  const c = store.withdrawal_confirmations.find(x => x.id === confirmationId);
  if(!c) return toast('السجل غير موجود','err');
  
  if(c.status !== 'pending'){
    return toast('تم التعامل مع هذا السجل مسبقاً','err');
  }
  
  const notes = (byId('confirm_notes') || {}).value || '';
  
  if(!notes.trim()){
    return toast('يرجى كتابة سبب طلب إعادة التشييك في الملاحظات','err');
  }
  
  // ✅ نافذة تأكيد
  const confirmed = window.confirm(
    '🔄 طلب إعادة تشييك\n\n' +
    'سيتم:\n' +
    '• إرسال إشعار للمشغّل وأمين المستودع\n' +
    '• سبب الطلب: ' + notes + '\n\n' +
    'هل أنت متأكد؟'
  );
  
  if(!confirmed) return;
  
  const d = store.distributors.find(x => x.id === c.distributor_id);
  
  // احفظ السبب في notes لكن لا تغيّر الحالة
  const patch = {
    notes: '[طلب إعادة تشييك] ' + notes
  };
  
  try{
    await adapter.updateSimple('withdrawal_confirmations', confirmationId, patch);
    Object.assign(c, patch);
    
    // ✅ إرسال إشعارات
    NotificationCenter.fire('withdrawal_recheck_requested', {
      distName: d ? d.name : 'موزع',
      reason: notes,
      itemsSummary: (c.items || []).map(i => i.product_name + ' × ' + fmt(i.qty_expected)).join('، '),
      refId: c.id
    }).catch(e => console.warn(e));
    
    toast('✅ تم إرسال طلب إعادة التشييك', 'ok');
    closeSheet();
    
  }catch(ex){
    console.error(ex);
    toast('تعذر الإرسال: ' + ex.message, 'err');
  }
}
  const wdForm = byId('wd-form');
  if(wdForm && wdForm.parentNode){
    wdForm.parentNode.insertBefore(distScanBtn, wdForm);
  }
  mountForm(byId('wd-form'),'wf',[
    {k:'date',label:'تاريخ السحب',type:'date',value:today},
    {k:'distributor_id',label:'الموزع (مقفل حتى المسح)',type:'select',options:opt.distributors,readonly:true},
    {k:'note',label:'ملاحظة (تنطبق على كل الأصناف)',type:'text'}
  ],{noSubmit:true,main:true});
  wdLB = lineBuilder(byId('wd-lines'),'withdrawal');

  byId('wd-save').onclick = async () => {
    if(!requirePerm('withdrawals'))return;
    const wf = forms.find(f => f.id === 'wf'), v = wf.vals();
    const lines = wdLB.values().filter(l => l.product_id && l.qty > 0);
    if(!v.distributor_id){toast('امسح بطاقة الموزع أولاً','err');return}
    if(!lines.length){toast('أضف صنفاً وكمية','err');return}
    if(!distributorPresentToday(v.distributor_id)){toast('الموزع غير حاضر اليوم بصورة','err');return}
    // نجمع الكميات لكل منتج للتحقق من المخزون (لو تكرر المنتج في أكثر من سطر)
    const need = {};
    lines.forEach(l => { need[l.product_id] = (need[l.product_id] || 0) + l.qty });
    for(const pid in need){
      const av = stockWH(store, pid);
      if(need[pid] > av + 1e-9){toast('المتاح من «' + pn(pid) + '» هو ' + fmt(av),'err');return}
    }
    const rows = lines.map(l => ({
      id: uuid(), date: v.date || today(), distributor_id: v.distributor_id, product_id: l.product_id, qty: l.qty,
      price: pOf(store, l.product_id).dist_price || pOf(store, l.product_id).price,
      note: v.note, by: user.name, ts: Date.now(), log: []
    }));
    const ok = await tryCommit(
      draft => { rows.slice().reverse().forEach(r => draft.withdrawals.unshift(r)) },
      async () => { for(const r of rows){ await adapter.saveSimple('withdrawals', r) } },
      {rerender:['withdrawals','overview','sales','distributors']}
    );
    if(ok){
      toast('تم تسجيل ' + rows.length + (rows.length > 1 ? ' أصناف' : ' صنف'),'ok');
      // 🆕 إنشاء سجل تشيك واحد يضم كل الأصناف
      try{
        const d = store.distributors.find(x => x.id === v.distributor_id);
        const items = rows.map(r => {
          const p = store.products.find(x => x.id === r.product_id);
          return {
            product_id: r.product_id,
            product_name: p ? p.name : '—',
            qty_expected: r.qty,
            qty_received: null,
            checked: false,
            withdrawal_id: r.id
          };
        });
        const confirmation = {
          id: uuid(),
          withdrawal_id: rows[0].id,
          distributor_id: v.distributor_id,
          distributor_user_id: d ? d.user_id : null,
          items: items,
          status: 'pending',
          confirmed_at: null,
          confirmed_by: null,
          notes: '',
          photo: null,
          ts: Date.now()
        };
        await adapter.saveSimple('withdrawal_confirmations', confirmation);
        if(!store.withdrawal_confirmations) store.withdrawal_confirmations = [];
        if(!store.withdrawal_confirmations.some(x => x.id === confirmation.id)) store.withdrawal_confirmations.unshift(confirmation);
        NotificationCenter.fire('withdrawal_created', {
          summary: items.map(i => i.product_name + ' × ' + fmt(i.qty_expected)).join('، '),
          distName: d ? d.name : 'موزع',
          distUserId: d ? d.user_id : null,
          refId: confirmation.id
        }).catch(e => console.warn('push notification failed:', e));
      }catch(ex){
        console.error('[Withdrawal] فشل إنشاء سجل التشيك:', ex);
      }
      wdLB.reset();
      try{ wf.set('note',''); wf.refresh(); }catch(e){}
      renderWithdrawals();
      lockWithdrawalForm();
    }
  };
  lockWithdrawalForm();

  function setWdLocked(locked){
    [byId('wf__distributor_id'), byId('wf__note'), byId('wd-save')].forEach(el => {
      if(el){ el.disabled = locked; el.style.opacity = locked ? '0.5' : '1'; }
    });
    document.querySelectorAll('#wd-lines input, #wd-lines select, #wd-lines button').forEach(el => {
      el.disabled = locked; el.style.opacity = locked ? '0.5' : '1';
    });
  }

  function lockWithdrawalForm(){
    const wf = forms.find(f => f.id === 'wf');
    if(!wf) return;
    setWdLocked(true);
    let hint = byId('wd-lock-hint');
    if(!hint){
      hint = document.createElement('div');
      hint.id = 'wd-lock-hint';
      if(wdForm && wdForm.parentNode){
        wdForm.parentNode.insertBefore(hint, wdForm);
      }
    }
    hint.className = 'notice';
    hint.style.cssText = 'border-color:var(--orange);background:rgba(255,176,74,.15);text-align:center;font-weight:800;margin-bottom:10px';
    hint.innerHTML = '⚠️ امسح بطاقة الموزع أولاً لتفعيل النموذج';
    const oldScan = byId('wd-scan-btn');
    if(oldScan) oldScan.remove();
  }

  function unlockWithdrawalForm(){
    const wf = forms.find(f => f.id === 'wf');
    if(!wf) return;
    setWdLocked(false);
    const hint = byId('wd-lock-hint');
    if(hint){
      hint.className = 'notice ok';
      hint.style.cssText = 'border-color:var(--green);background:rgba(61,220,132,.15);text-align:center;font-weight:800;margin-bottom:10px';
      hint.innerHTML = '✅ تم مسح البطاقة — أضف الأصناف ثم سجّل السحب';
    }
    if(!byId('wd-scan-btn')){
      const scanBtn = document.createElement('button');
      scanBtn.type = 'button';
      scanBtn.id = 'wd-scan-btn';
      scanBtn.className = 'btn-ghost';
      scanBtn.style.cssText = 'width:100%;margin:10px 0;display:flex;align-items:center;justify-content:center;gap:8px';
      scanBtn.innerHTML = '<span style="font-size:18px">📷</span> مسح منتج للمسحوبة';
      scanBtn.onclick = () => {
        if(!window.openScanner){ toast('وحدة المسح غير محمّلة','err'); return; }
        window.openScanner({
          title: 'مسح منتج للمسحوبة', mode: 'product', screen: 'withdrawals',
          onFound: (product, code) => {
            const c = byId('wd-lines'); if(!c) return;
            let hit = null;
            c.querySelectorAll('.lineitem').forEach(r => {
              const sel = r.querySelector('[data-f="product_id"]');
              if(sel && sel.value === product.id) hit = r;
            });
            const focusQty = row => { const q = row.querySelector('[data-f="qty"]'); if(q){ q.focus(); q.select(); } };
            if(hit){
              const q = hit.querySelector('[data-f="qty"]');
              q.value = (parseFloat(q.value) || 0) + 1;
              focusQty(hit);
            } else {
              lbAddScanned(c, row => {
                row.querySelector('[data-f="product_id"]').value = product.id;
                const q = row.querySelector('[data-f="qty"]'); q.value = 1;
                focusQty(row);
              });
            }
            toast('✅ ' + product.name,'ok');
          },
          store, toast, escHtml, adapter, user, uuid, closeSheet, openSheet
        });
      };
      const linesEl = byId('wd-lines');
      if(linesEl && linesEl.parentNode){
        linesEl.parentNode.insertBefore(scanBtn, linesEl);
      }
    }
  }
}

let purLB;
function mountPurchases(){
  mountForm(byId('pu-head'),'uh',[
    {k:'date',label:'تاريخ الشراء',type:'date',value:today},
    {k:'supplier_id',label:'المورّد',type:'select',nophd:true,options:()=>[['','بدون مورّد']].concat(opt.suppliers())},
    {k:'payment',label:'طريقة الدفع',type:'radio',options:[['cash','نقداً'],['credit','آجل']]},
    {k:'paid_via',label:'تفاصيل الدفع',type:'text'},
    {k:'photo',label:'صورة الفاتورة (اختياري)',type:'file'}
  ],{noSubmit:true,main:true});
  purLB=lineBuilder(byId('pu-lines'),'purchase');
  byId('pu-save').onclick=async()=>{
    if(!requirePerm('purchases'))return;
    const hf=forms.find(f=>f.id==='uh'),v=hf.vals();
    const allLines=purLB.values();
    const lines=allLines.filter(l=>l.item&&l.qty>0);
    if(!lines.length){
      const empty=allLines.filter(l=>!l.item);
      const zeroQty=allLines.filter(l=>l.item&&!(l.qty>0));
      let msg='أضف صنفاً صحيحاً:';
      if(empty.length)msg+=' اكتب "اسم الصنف".';
      if(zeroQty.length)msg+=' أدخل كمية أكبر من صفر.';
      toast(msg,'err');return;
    }
    if(!v.payment){toast('اختر طريقة الدفع','err');return}
    if(v.payment==='credit'&&!v.supplier_id){toast('الآجل يحتاج مورّداً','err');return}
    const header={id:uuid(),date:v.date||today(),supplier_id:v.supplier_id||null,payment:v.payment,paid_via:v.paid_via||'',photo:v.photo||null,by:user.name,ts:Date.now()};
    const items=lines.map(l=>({id:uuid(),item:l.item,product_id:null,material_id:l.material_id||null,qty:l.qty,unit_cost:l.unit_cost}));
    const ok=await tryCommit(
      draft=>{draft.purchases.unshift(Object.assign({},header,{items}))},
      async()=>{await adapter.saveTicket('purchases','purchase_items','purchase_id',header,items)},
      {rerender:['purchases','overview','withdrawals']}
    );
    if(ok){
      toast('تم','ok');
      const req=window.__pendingPurchaseRequest;
      if(req){
        try{
          await adapter.updateSimple('purchase_requests',req.id,{
            status:'converted',converted_purchase_id:header.id,
            approved_by:user.name,approved_at:Date.now()
          });
          const draft2=clone(store);
          const r2x=(draft2.purchase_requests||[]).find(x=>x.id===req.id);
          if(r2x){r2x.status='converted';r2x.converted_purchase_id=header.id;r2x.approved_by=user.name;r2x.approved_at=Date.now()}
          store=draft2;
          renderAll();
          toast('✅ تم ربط الطلب بفاتورة الشراء','ok');
        }catch(e){console.warn('update request failed:',e);}
        delete window.__pendingPurchaseRequest;
      }
      hf.reset();
      purLB.reset();
    }
  };
}

        draft=>{draft.supplier_payments.unshift(row)},
        async()=>{await adapter.saveSimple('supplier_payments',row)},
        {rerender:['purchases','overview']}
      );
      if(ok){closeSheet();toast('تم','ok')}
      return false;
    }});
}

function customerWhatsAppSheet(cid){
  const c=store.customers.find(x=>x.id===cid);if(!c)return;
  const bal=custBal(store,c);
  const invs=store.sale_items_flat.filter(s=>s.customer_id===cid&&s.type==='credit');
  const byHeader={};invs.forEach(it=>{(byHeader[it.header_id]=byHeader[it.header_id]||{date:it.date,items:[]}).items.push(it)});
  const list=Object.entries(byHeader).map(([hid,h])=>({date:h.date,amount:sum(h.items,saleItemNet)})).sort((a,b)=>a.date.localeCompare(b.date));
  const lines=['السلام عليكم '+c.name+'،','نودّ تذكيركم بموعد سداد الفواتير المستحقة:',''];
  list.slice(-5).forEach(inv=>{lines.push('• فاتورة '+inv.date+' — '+fmt(inv.amount)+' '+cur())});
  lines.push('');
  lines.push('المبلغ المتبقي: '+fmt(bal.remaining)+' '+cur());
  if(bal.tax>0)lines.push('ضريبة تأخير: '+fmt(bal.tax)+' '+cur());
  if(bal.due)lines.push('تاريخ الاستحقاق: '+bal.due);
  lines.push('');
  lines.push('شاكرين تعاونكم — '+store.company.name);
  const text=lines.join('\n');
  openSheet('<h3>رسالة للعميل '+escHtml(c.name)+'</h3>'+
    '<p class="muted">الهاتف: '+escHtml(c.phone||'غير مسجل')+'</p>'+
    '<textarea class="rep" rows="10" id="wa-text"></textarea>'+
    '<div class="btnrow">'+
      (c.phone?'<a class="btn-primary" style="text-align:center;text-decoration:none;display:block" target="_blank" href="https://wa.me/'+c.phone.replace(/[^\d]/g,'')+'?text='+encodeURIComponent(text)+'">📱 فتح واتساب</a>':'<span class="hint">أضف رقم هاتف للعميل من الإدارة</span>')+
      '<button class="btn-ghost" id="wa-copy">نسخ</button>'+
    '</div>');
  byId('wa-text').value=text;
  byId('wa-copy').onclick=()=>copyText(text);
}

function prLineBuilder(container){
  const rows=[];
  const FIELDS=[
    {k:'type',label:'النوع',type:'select',nophd:true,options:[['product','منتج جاهز'],['material','مادة خام']]},
    {k:'product_id',label:'المنتج',type:'select',nophd:true,options:()=>[['','— اختر منتجاً —']].concat(opt.products())},
    {k:'material_id',label:'المادة الخام',type:'select',nophd:true,options:()=>[['','— اختر مادة —']].concat(opt.materials())},
    {k:'qty',label:'الكمية المطلوبة',type:'number',v:0,step:'0.001'},
    {k:'note',label:'ملاحظة',type:'text',v:'',full:true}
  ];
  function rowHTML(id){
    return '<div class="lineitem" data-row="'+id+'"><button type="button" class="rm" data-rm="'+id+'" aria-label="حذف السطر">×</button><div class="g2">'+
      FIELDS.map(f=>{
        const fid='pri_'+id+'_'+f.k;
        const full=f.full?' style="grid-column:1/-1"':'';
        if(f.type==='select'){
          const rawOpts=typeof f.options==='function'?f.options():(f.options||[]);
          const opts=f.nophd?rawOpts:[['','اختر...']].concat(rawOpts);
          return '<div'+full+'><label class="fl" style="margin-top:4px">'+escHtml(f.label)+'</label><select class="in" id="'+fid+'" data-pf="'+f.k+'">'+
            opts.map(o=>'<option value="'+escHtml(o[0])+'">'+escHtml(o[1])+'</option>').join('')+'</select></div>';
        }
        return '<div'+full+'><label class="fl" style="margin-top:4px">'+escHtml(f.label)+'</label><input class="in" id="'+fid+'" data-pf="'+f.k+'" type="'+f.type+'"'+
          (f.type==='number'?' inputmode="decimal" min="0" step="'+(f.step||'any')+'"':'')+' value="'+escHtml(f.v)+'"></div>';
      }).join('')+'</div></div>';
  }
  function snapshot(){
    const snap={};
    container.querySelectorAll('.lineitem').forEach(row=>{
      const o={};row.querySelectorAll('[data-pf]').forEach(e=>{o[e.getAttribute('data-pf')]=e.value});
      snap[row.getAttribute('data-row')]=o;
    });
    return snap;
  }
  function addRow(){const saved=snapshot();const id=rows.length?Math.max.apply(null,rows)+1:1;rows.push(id);render(saved)}
  function render(saved){
    container.innerHTML=rows.map(rowHTML).join('')+'<button type="button" class="addline" data-add>+ إضافة صنف آخر</button>';
    if(saved){
      container.querySelectorAll('.lineitem').forEach(row=>{
        const o=saved[row.getAttribute('data-row')];if(!o)return;
        row.querySelectorAll('[data-pf]').forEach(e=>{const k=e.getAttribute('data-pf');if(o[k]!=null)e.value=o[k]});
      });
    }
    container.querySelectorAll('.lineitem').forEach(row=>{
      const typeSel=row.querySelector('[data-pf="type"]');
      const prodDiv=row.querySelector('[data-pf="product_id"]').parentElement;
      const matDiv=row.querySelector('[data-pf="material_id"]').parentElement;
      const updateVisibility=()=>{
        if(typeSel.value==='product'){prodDiv.style.display='';matDiv.style.display='none'}
        else{prodDiv.style.display='none';matDiv.style.display=''}
      };
      typeSel.onchange=updateVisibility;
      updateVisibility();
    });
    container.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{
      const id=Number(b.dataset.rm);
      const saved2=snapshot();
      const i=rows.indexOf(id);if(i>=0)rows.splice(i,1);
      if(!rows.length){rows.push(1);render({})}else render(saved2);
    });
    container.querySelector('[data-add]').onclick=addRow;
  }
  addRow();
  return{
    values(){
      const out=[];
      container.querySelectorAll('.lineitem').forEach(row=>{
        const o={};
        const type=row.querySelector('[data-pf="type"]').value;
        o.product_id=type==='product'?(row.querySelector('[data-pf="product_id"]').value||null):null;
        o.material_id=type==='material'?(row.querySelector('[data-pf="material_id"]').value||null):null;
        const qtyEl=row.querySelector('[data-pf="qty"]');
        o.qty=Math.max(parseFloat(qtyEl.value)||0,0);
        o.note=(row.querySelector('[data-pf="note"]').value||'').trim();
        out.push(o);
      });
      return out;
    },
    reset(){rows.length=0;container.innerHTML='';addRow()}
  };
}

      const dur = s.checkout_ts ? calcShiftDurationMinutes(s.checkin_ts, s.checkout_ts) : null;
      recs.push({
        kind: 'dist_shift', date: s.date, by: s.by, ts: s.ts || s.checkin_ts || 0,
        user: d ? d.name : '—', shift: s.shift,
        checkin: s.checkin_ts ? new Date(s.checkin_ts).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }) : '—',
        checkout: s.checkout_ts ? new Date(s.checkout_ts).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }) : '—',
        duration: dur, photos: [s.checkin_photo, s.checkout_photo].filter(Boolean), closed: s.closed
      });
    });
  }
  if(_attFilter==='all'||_attFilter==='op_shifts'){
    (store.operator_shifts || []).forEach(s => {
      const o = store.operators.find(x => x.id === s.operator_id);
      const dur = s.checkout_ts ? calcShiftDurationMinutes(s.checkin_ts, s.checkout_ts) : null;
      recs.push({
        kind: 'op_shift', date: s.date, by: s.by, ts: s.ts || s.checkin_ts || 0,
        user: o ? o.name : '—', shift: s.shift,
        checkin: s.checkin_ts ? new Date(s.checkin_ts).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }) : '—',
        checkout: s.checkout_ts ? new Date(s.checkout_ts).toLocaleTimeString('ar-EG', { hour: '2-digit', minute: '2-digit' }) : '—',
        duration: dur, photos: [s.checkin_photo, s.checkout_photo].filter(Boolean), closed: s.closed
      });
    });
  }
  if(_attFilter==='all'||_attFilter==='shifts'){
    (store.attendance_shifts||[]).forEach(s=>{
      const dur=s.checkout_ts?Math.round((s.checkout_ts-s.checkin_ts)/60000):null;
      recs.push({kind:'shift',date:s.date,by:s.by,ts:s.ts||s.checkin_ts||0,
        user:(s.by||'—'),
        checkin:s.checkin_ts?new Date(s.checkin_ts).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}):'—',
        checkout:s.checkout_ts?new Date(s.checkout_ts).toLocaleTimeString('ar-EG',{hour:'2-digit',minute:'2-digit'}):'—',
        duration:dur,photos:[s.checkin_photo,s.checkout_photo].filter(Boolean),closed:s.closed});
    });
  }
  recs.sort((a,b)=>(b.ts||0)-(a.ts||0));
  const rows=recs.slice(0,60);
  const html=rows.length?rows.map(r=>{
    const tagCls=r.kind==='production'?'rec':(r.kind==='distributors'||r.kind==='dist_shift'||r.kind==='op_shift')?'cash':'adm';
    const tagTxt=r.kind==='production'?'إنتاج':r.kind==='distributors'?'موزعين':r.kind==='dist_shift'?'وردية موزع':r.kind==='op_shift'?'وردية مشغّل':'وردية موظف';
    if(r.kind==='shift'||r.kind==='dist_shift'||r.kind==='op_shift'){
      const durationText = r.duration != null ? r.duration + ' دقيقة (' + r2(r.duration / 60) + ' ساعة)' : '';
      return '<div class="card" style="margin-bottom:10px">'+
        '<div style="display:flex;justify-content:space-between;align-items:center;gap:8px">'+
        '<div><b>'+escHtml(r.user)+'</b> '+tag(tagCls,tagTxt)+(r.shift?' '+tag('rec',SHIFT_AR[r.shift]||r.shift):'')+
        '<div class="muted" style="font-size:12px">'+r.date+' · '+r.checkin+' → '+r.checkout+(durationText?' ('+durationText+')':'')+'</div></div>'+
        (r.closed?'<span class="tag cash">مغلقة</span>':'<span class="tag credit">مفتوحة</span>')+
        '</div>'+
        (r.photos.length?'<div class="chips" style="margin-top:8px">'+r.photos.map(u=>'<img class="att-photo" src="'+u+'" data-att-big="'+u+'" alt="">').join('')+'</div>':'')+
        '</div>';
    }
    return '<div class="card" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><b>'+r.date+'</b> '+tag(tagCls,tagTxt)+'<div class="muted" style="font-size:12px">بواسطة '+escHtml(r.by||'—')+'</div></div></div>'+
      '<div style="margin-top:8px"><b>حاضر:</b> '+(r.present.length?r.present.map(escHtml).join('، '):'—')+'</div>'+
      (r.absent.length?'<div class="dn"><b>غائب:</b> '+r.absent.map(escHtml).join('، ')+'</div>':'')+
      (r.photos&&r.photos.length?'<div class="chips" style="margin-top:8px">'+r.photos.map(u=>'<img class="att-photo" src="'+u+'" data-att-big="'+u+'" alt="">').join('')+'</div>':'')+
      '</div>';
  }).join(''):'<div class="empty">لا سجلات بعد</div>';
  byId('att-body').innerHTML=html;
  $$('[data-att-big]').forEach(img=>img.onclick=()=>openSheet('<h3>صورة</h3><img class="att-photo big" src="'+img.dataset.attBig+'" alt="">'));
}

function entUsedCount(ent,id){
  const t=REFS[ent]||[];let n=0;
  if(t.indexOf('shift_items')>=0)n+=store.shift_items_flat.filter(x=>x.product_id===id||x.operator_id===id).length;
  if(t.indexOf('sale_items')>=0)n+=store.sale_items_flat.filter(x=>x.product_id===id||x.customer_id===id||x.distributor_id===id).length;
  if(t.indexOf('purchase_items')>=0)n+=store.purchase_items_flat.filter(x=>x.product_id===id||x.material_id===id||x.supplier_id===id).length;
  if(t.indexOf('withdrawals')>=0)n+=(store.withdrawals||[]).filter(x=>x.product_id===id||x.distributor_id===id).length;
  if(t.indexOf('payments')>=0)n+=(store.payments||[]).filter(x=>x.customer_id===id||x.distributor_id===id).length;
  if(t.indexOf('remittances')>=0)n+=(store.remittances||[]).filter(x=>x.distributor_id===id).length;
  if(t.indexOf('products')>=0)n+=(store.products||[]).filter(x=>x.material_id===id).length;
  return n;
}

        draft.audit.unshift(auditRow('إضافة','عميل: '+v.name));

        index(draft);
      },
      {rerender:['sales']}
    );

      toast('تم إضافة العميل','ok');closeSheet();

      return;
    }
    // منع الوصول للجميع ما عدا المؤهلين
    if(!canAddProduct()){
      toast('ليس لديك صلاحية','err');
      return;
    }
  } else {
    // باقي الأنواع: للمدير فقط
    if(!isA()){toast('الإدارة للمدير فقط','err');return}
  }
  
  const cfg=ENT[ent],rec=id?store[ent].find(x=>x.id===id):null;
  const fields=cfg.fields.map(f=>Object.assign({},f,{value:rec?(f.k==='password'?'':rec[f.k]):f.value}));
  openSheet('<h3>'+(rec?'تعديل':'إضافة')+' '+cfg.title+'</h3><div id="ent-form"></div>'+(rec?'<button class="btn-danger btn-block" id="ent-del">حذف</button>':''));
  mountForm(byId('ent-form'),'ent',fields,{label:'حفظ',submit:async v=>{
    if(!v.name){toast('أدخل الاسم','err');return false}
    if(ent==='products'&&v.price<=0){toast('أدخل سعر البيع','err');return false}
    if(ent==='users'){
      const un=(v.username||'').toLowerCase().replace(/\s+/g,'');
      if(!un){toast('أدخل اسم المستخدم','err');return false}
      if(store.users.some(u=>u.username===un&&u.id!==id)){toast('الاسم مستخدم','err');return false}
      if(!rec&&!v.password){toast('أدخل كلمة مرور','err');return false}
      if(v.password&&v.password.length<4){toast('4 أحرف على الأقل','err');return false}
      v.username=un;
      if(rec&&rec.id===user.id&&!v.active){toast('لا يمكنك تعطيل حسابك','err');return false}
      try{
        const uid2=await adapter.upsertUser(Object.assign({id:rec?rec.id:null},v));
        const draft=clone(store);
        if(rec){
          const x=draft.users.find(y=>y.id===rec.id);
          Object.assign(x,omit(v,['password']));
          if(v.password)x.default_pw=false;
        }else{
          draft.users.push(Object.assign({id:uid2},omit(v,['password']),{default_pw:true}));
        }
        draft.audit.unshift(auditRow(rec?'تعديل':'إضافة','مستخدم: '+v.name));
        store=draft;
        closeSheet();toast('تم','ok');
        startApp(ui.tab);
      }catch(ex){console.error(ex);toast('تعذر: '+ex.message,'err')}
      return false;
    }
    cfg.fields.forEach(f=>{if(f.type==='select'&&v[f.k]==='')v[f.k]=null});
    const row=Object.assign({},rec?{id:rec.id}:{},v);
    const ok=await tryCommit(
      draft=>{
        if(rec){const x=draft[ent].find(y=>y.id===id);Object.assign(x,v)}
        else draft[ent].push(Object.assign({id:'__new__'},v));
        draft.audit.unshift(auditRow(rec?'تعديل':'إضافة',cfg.title));
      },
      async draft=>{
        const newId=await adapter.saveEntity(ent,row);
        if(!rec){
          const x=draft[ent].find(y=>y.id==='__new__');
          x.id=newId;
          index(draft);
        }
      }
    );
    if(ok){closeSheet();toast('تم','ok')}
    return false;
  }});
  const del=byId('ent-del');
  if(del)del.onclick=()=>{
    if(ent==='users'){
      if(rec.id===user.id)return toast('لا يمكنك حذف حسابك','err');
      return confirmSheet('حذف «'+rec.name+'»؟','حذف',async()=>{
        try{
          await adapter.deleteUser(id);
          const draft=clone(store);
          draft.users=draft.users.filter(x=>x.id!==id);
          draft.audit.unshift(auditRow('حذف','مستخدم'));
          store=draft;
          closeSheet();toast('تم','ok');
          startApp(ui.tab);
        }catch(ex){toast('تعذر','err')}
      });
    }
    const used=entUsedCount(ent,id);
    if(used>0)return toast('مستخدم في '+used+' سجل','err');
    confirmSheet('حذف «'+rec.name+'»؟','حذف',async()=>{
      const ok=await tryCommit(
        draft=>{
          draft[ent]=draft[ent].filter(x=>x.id!==id);
          if(ent==='distributors')draft.customers.forEach(x=>{if(x.distributor_id===id)x.distributor_id=null});
          draft.audit.unshift(auditRow('حذف',cfg.title));
        },
        async()=>{await adapter.deleteEntity(ent,id)}
      );
      if(ok)toast('تم','ok');
    });
  };
}

      if(k === 'operator') return [['', '— اختر مشغّل —']].concat(opt.operators());
      if(k === 'user') return [['', '— اختر حساب —']].concat((store.users||[]).filter(u => u.active).map(u => [u.id, u.name + ' (@' + u.username + ')']));

    }, value:''},

      ['units', '📦 الكمية (وحدات)'],
      ['amount', '💰 المبلغ (' + cur() + ')']
    ], value:'units'},

    {k:'reward_type', label:'نوع المكافأة', type:'select', nophd:true, options:[
      ['per_unit', 'مبلغ لكل وحدة'],
      ['percent', 'نسبة مئوية'],
      ['multiplier', 'مضاعف الحافز (مثال: 2)'],
      ['fixed', 'مبلغ ثابت']
    ], value:'per_unit'},
    {k:'reward_value', label:'قيمة المكافأة', type:'number', value:0, step:'0.001'},
    {k:'valid_from', label:'صالح من (اختياري)', type:'date', value:''},
    {k:'valid_to', label:'صالح حتى (اختياري)', type:'date', value:''},
    {k:'notes', label:'ملاحظات', type:'textarea'}
  ], {
    label:'🎁 إضافة قاعدة',

      if(v.target_type !== 'all' && !v.target_id){ toast('اختر الطرف المستفيد','err'); return false; }
      
            const row = {
        name: v.name.trim(),
        scope: v.scope,
        target_type: v.target_type,

  renderBonusRulesList();

document.addEventListener('click', function(e){
  const toggle = e.target.closest('[data-br-toggle]');
  if(toggle){
    const id = toggle.dataset.brToggle;
    const rule = store.bonus_rules.find(r => r.id === id);
    if(!rule) return;
    const wasActive = rule.active;

    (async () => {
      const ok = await tryCommit(
        draft => {
          const r = (draft.bonus_rules||[]).find(x => x.id === id);
          if(r) r.active = !wasActive;
        },
        async () => { await adapter.updateSimple('bonus_rules', id, {active: !wasActive}); },
        {rerender:['management']}
      );
      if(ok){
        toast(wasActive ? 'تم الإيقاف' : 'تم التشغيل', 'ok');
        renderBonusRulesList();
      } else {
        toast('تعذر','err');
      }
    })();
    return;
  }
  
  const del = e.target.closest('[data-br-delete]');
  if(del){
    if(!isA()) return toast('للمدير فقط','err');
    const id = del.dataset.brDelete;
    const rule = store.bonus_rules.find(r => r.id === id);
    if(!rule) return;
    
    confirmSheet('حذف القاعدة «' + rule.name + '»؟', 'حذف', async () => {
      const ok = await tryCommit(
        draft => {
          draft.bonus_rules = (draft.bonus_rules||[]).filter(x => x.id !== id);

        },

      );

        toast('تم الحذف','ok');

let _baFilter = 'pending';

function renderBonusAwards(){
  const el = byId('ba-content');
  if(!el) return;
  
  const all = store.bonus_awards || [];
  const pending = all.filter(a => a.status === 'pending');
  const approved = all.filter(a => a.status === 'approved');
  const paid = all.filter(a => a.status === 'paid');
  const rejected = all.filter(a => a.status === 'rejected');
  
  const filtered = 
    _baFilter === 'pending' ? pending :
    _baFilter === 'approved' ? approved :
    _baFilter === 'paid' ? paid :
    _baFilter === 'rejected' ? rejected : all;
  
  const totalPending = sum(pending, a => a.reward_amount);
  const totalApproved = sum(approved, a => a.reward_amount);
  const totalPaid = sum(paid, a => a.reward_amount);
  
  el.innerHTML = 
    '<div class="kgrid" style="margin-bottom:12px">' +
      '<div class="kpi"><div class="lb">⏳ معلّقة</div>' +
        '<div class="val warn">' + fmt(totalPending) + '</div>' +
        '<div class="sub mut">' + pending.length + ' مكافأة</div></div>' +
      '<div class="kpi"><div class="lb">✅ معتمدة</div>' +
        '<div class="val up">' + fmt(totalApproved) + '</div>' +
        '<div class="sub mut">' + approved.length + ' مكافأة</div></div>' +
      '<div class="kpi wide"><div class="lb">💵 مدفوعة</div>' +
        '<div class="val">' + fmt(totalPaid) + ' ' + cur() + '</div>' +
        '<div class="sub mut">' + paid.length + ' مكافأة</div></div>' +
    '</div>' +
    
    '<div class="pills" style="margin:12px 0">' +
      '<button class="pill' + (_baFilter === 'pending' ? ' on' : '') + '" data-ba-filter="pending">⏳ معلّقة (' + pending.length + ')</button>' +
      '<button class="pill' + (_baFilter === 'approved' ? ' on' : '') + '" data-ba-filter="approved">✅ معتمدة (' + approved.length + ')</button>' +
      '<button class="pill' + (_baFilter === 'paid' ? ' on' : '') + '" data-ba-filter="paid">💵 مدفوعة (' + paid.length + ')</button>' +
      '<button class="pill' + (_baFilter === 'rejected' ? ' on' : '') + '" data-ba-filter="rejected">❌ مرفوضة (' + rejected.length + ')</button>' +
      '<button class="pill' + (_baFilter === 'all' ? ' on' : '') + '" data-ba-filter="all">الكل (' + all.length + ')</button>' +
    '</div>' +
    
    '<div id="ba-list"></div>';
  
  const list = byId('ba-list');
  const sorted = [...filtered].sort((a,b) => (b.ts || 0) - (a.ts || 0));
  
  if(!sorted.length){
    list.innerHTML = '<div class="empty">لا توجد مكافآت</div>';
    return;
  }
  
  list.innerHTML = sorted.slice(0, 50).map(award => {
    let statusTag;
    if(award.status === 'pending') statusTag = '<span class="tag credit">⏳ معلّقة</span>';
    else if(award.status === 'approved') statusTag = '<span class="tag rec">✅ معتمدة</span>';
    else if(award.status === 'paid') statusTag = '<span class="tag cash">💵 مدفوعة</span>';
    else statusTag = '<span class="tag disc">❌ مرفوضة</span>';
    
    let actionsHTML = '';
    if(award.status === 'pending'){
      actionsHTML = 
        '<div class="btnrow" style="margin-top:8px">' +
          '<button class="btn-primary sm" data-ba-approve="' + award.id + '">✅ اعتماد</button>' +
          '<button class="btn-danger sm" data-ba-reject="' + award.id + '">❌ رفض</button>' +
        '</div>';
    } else if(award.status === 'approved'){
      actionsHTML = 
        '<div class="btnrow" style="margin-top:8px">' +
          '<button class="btn-primary sm" data-ba-pay="' + award.id + '">💵 تسجيل الدفع</button>' +
        '</div>';
    }
    
    return '<div class="card" style="margin-bottom:8px;border-color:' +
      (award.status === 'pending' ? 'var(--orange)' : 
       award.status === 'paid' ? 'var(--green)' : 
       award.status === 'rejected' ? 'var(--red)' : 'var(--blue)') + '">' +
      '<div style="display:flex;justify-content:space-between;align-items:start;gap:8px">' +
        '<div style="flex:1;min-width:0">' +
          '<b>🎁 ' + escHtml(award.rule_name) + '</b> ' + statusTag +
          '<small style="display:block;color:var(--muted);font-size:12px;margin-top:4px">' +
            (award.scope === 'sales' ? '🛒 مبيعات' : '🏭 إنتاج') + ' · ' + 
            escHtml(award.target_name || '—') + ' · ' + award.date +
          '</small>' +
          '<small style="display:block;color:var(--muted);font-size:12px">' +

async function approveBonusAward(id){
  const award = store.bonus_awards.find(a => a.id === id);
  if(!award) return;
  
  const patch = {
    status: 'approved',
    approved_by: user.name,
    approved_at: Date.now()
  };
  
  try{
    await adapter.updateSimple('bonus_awards', id, patch);
    const draft = clone(store);
    const a = draft.bonus_awards.find(x => x.id === id);
    if(a) Object.assign(a, patch);
    draft.audit.unshift(auditRow('اعتماد','مكافأة: ' + award.rule_name + ' - ' + fmt(award.reward_amount)));
    store = draft;
       // 🆕 إشعار للمستفيد

      const d = store.distributors.find(x => x.id === award.target_id);
      if(d && d.user_id) targetUserId = d.user_id;
    } else if(award.target_type === 'operator'){
      const o = store.operators.find(x => x.id === award.target_id);
      if(o && o.user_id) targetUserId = o.user_id;
    }
    
    if(targetUserId){
      NotificationCenter.fire('bonus_approved', {
        targetUserId: targetUserId,
        ruleName: award.rule_name,
        amount: fmt(award.reward_amount) + ' ' + cur(),
        url: award.scope === 'sales' ? '/#dist_ops' : '/#op_ops'

    toast('✅ تم الاعتماد','ok');

  }catch(ex){
    console.error(ex);
    toast('تعذر','err');
  }
}

function dataAction(a){
  if(!isA())return toast('للمدير فقط','err');
  if(a==='backup'){
    const txt=JSON.stringify(store);
    openSheet('<h3>نسخة احتياطية</h3><textarea class="rep" id="bk" rows="7" readonly></textarea><button class="btn-primary btn-block" id="bk-copy">نسخ</button>');

    if(adapter.mode==='cloud')return toast('محلي فقط','err');
    openSheet('<h3>استعادة</h3><textarea class="rep" id="rs" rows="7"></textarea><button class="btn-danger btn-block" id="rs-go">استعادة</button>');
    byId('rs-go').onclick=()=>{
      try{
        const o=JSON.parse(byId('rs').value);
        if(!o||!Array.isArray(o.users)||!Array.isArray(o.products)||!o.company)throw new Error('bad');
        ['materials','operators','distributors','customers','suppliers','shifts','withdrawals','sales','payments','purchases','remittances','supplier_payments','notices','audit','discounts','attendance_shifts','purchase_requests','push_subscriptions','scan_log','distributor_shifts','operator_shifts'].forEach(k=>{if(!Array.isArray(o[k]))o[k]=[]});
        localStorage.setItem(DBKEY,JSON.stringify(o));
        closeSheet();toast('تمت — سجّل الدخول','ok');
        logout();
      }catch(e){toast('غير صالحة','err')}
    };
  }else if(a==='clear'){
    confirmSheet('حذف كل الحركات؟','مسح',async()=>{
      const draft=clone(store);
      ['shifts','withdrawals','sales','payments','purchases','remittances','supplier_payments','notices','audit','discounts','attendance_shifts','purchase_requests','distributor_shifts','operator_shifts'].forEach(k=>draft[k]=[]);

      if(adapter.mode==='local'){store=draft;LocalAdapter._p();renderAll()}

    confirmSheet('حذف كل شيء؟','بدء جديد',async()=>{
      if(adapter.mode!=='local')return toast('محلي فقط','err');
      const draft=clone(store);
      ['products','materials','customers','distributors','operators','suppliers','shifts','withdrawals','sales','payments','purchases','remittances','supplier_payments','notices','audit','discounts','attendance_shifts','purchase_requests','push_subscriptions','scan_log','distributor_shifts','operator_shifts'].forEach(k=>draft[k]=[]);
      draft.users=draft.users.filter(u=>u.id===user.id);
      draft.company.demo=false;
      store=draft;
      LocalAdapter._p();
      toast('تم','ok');
      renderAll();
    });
  }else if(a==='demo'){
    confirmSheet('استبدال كل البيانات؟','استعادة',async()=>{store=await seedStore();LocalAdapter._p();logout();toast('تمت','ok')});
  }
}
